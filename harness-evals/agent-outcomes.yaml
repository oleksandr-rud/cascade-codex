    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 3
    max_output_chars: 5500
    model: gpt-5.6-terra
    next_route: ""
    primary_skill: ux-flow-review
    product_context_required: true
    prompt: Review the current multi-screen persona-simulation journey for continuity, recovery, responsive state coverage, and clear completion. Ground the review in docs/product/journeys.md, docs/product/scenarios.md, and docs/design/interaction-model.md; remain read-only and identify the appropriate next route.
