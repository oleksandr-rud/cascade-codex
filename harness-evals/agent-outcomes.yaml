agents:
  - agent: orchestrator
    allowed_supporting:
      - context
      - docs-impact-map
    context_sources:
      - docs/product/requirements.md
      - docs/product/scenarios.md
      - docs/specs/persona-simulation-governance/contract.md
    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 3
    max_output_chars: 7000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: plan-change
    product_context_required: true
    prompt: Prepare the smallest implementation-ready plan for a product-visible change to the current Cascade persona-simulation workflow. Use docs/product/requirements.md, docs/product/scenarios.md, and docs/specs/persona-simulation-governance/contract.md as the routed product sources. Keep specifications proportional, avoid creating a work graph unless the request truly needs one, and identify the appropriate implementation handoff.
    reasoning_effort: high
    required_evidence_paths:
      - docs/product/requirements.md
      - docs/product/scenarios.md
    sandbox_mode: default
    status_any:
      - PASS
      - GAP
  - agent: agent-engineer
    allowed_supporting:
      - agents-best-practices
    context_sources:
      - AGENTS.md
      - CODEX.md
      - .codex/agents/agent-engineer/AGENT.md
      - .codex/agents/agent-engineer/skills.yaml
    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 2
    max_output_chars: 7000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: codex-maintenance
    product_context_required: false
    prompt: Audit whether the current Cascade agent manifests, role contracts, and skill maps are ported consistently. Use AGENTS.md, CODEX.md, .codex/agents/agent-engineer/AGENT.md, .codex/agents/agent-engineer/skills.yaml, and the existing validator as the bounded source set. Separate mechanical wiring checks from semantic model behavior, identify only concrete gaps, and propose the smallest correction without editing files.
    reasoning_effort: high
    required_evidence_paths:
      - .codex/agents/agent-engineer/AGENT.md
    sandbox_mode: default
    status_any:
      - PASS
      - GAP
  - agent: business-analyst
