agents:
  - agent: orchestrator
    allowed_supporting:
      - context
    context_sources:
      - docs/product/requirements.md
      - docs/product/scenarios.md
      - docs/specs/persona-simulation-governance/contract.md
    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 3
    max_output_chars: 7000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: plan-change
    product_context_required: true
    prompt: Prepare the smallest implementation-ready plan for a product-visible change to the current Cascade persona-simulation workflow. Use docs/product/requirements.md, docs/product/scenarios.md, and docs/specs/persona-simulation-governance/contract.md as the routed product sources. Keep specifications proportional, avoid creating a work graph unless the request truly needs one, and identify the appropriate implementation handoff.
    reasoning_effort: high
    required_evidence_paths:
      - docs/product/requirements.md
      - docs/product/scenarios.md
    sandbox_mode: default
    status_any:
      - PASS
      - GAP
  - agent: agent-engineer
    allowed_supporting: []
    context_sources:
      - AGENTS.md
      - CODEX.md
      - .codex/agents/agent-engineer/AGENT.md
      - .codex/agents/agent-engineer/skills.yaml
      - .codex/plugins/cascade-coding-agent/skills/audit-harness/SKILL.md
    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 1
    max_output_chars: 7000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: cascade-coding-agent:audit-harness
    product_context_required: false
    prompt: Audit whether the current Cascade agent manifests, role contracts, and skill maps are ported consistently. Use AGENTS.md, CODEX.md, .codex/agents/agent-engineer/AGENT.md, .codex/agents/agent-engineer/skills.yaml, and the existing validator as the bounded source set. Separate mechanical wiring checks from semantic model behavior, identify only concrete gaps, and propose the smallest correction without editing files.
    reasoning_effort: high
    required_evidence_paths:
      - .codex/agents/agent-engineer/AGENT.md
    sandbox_mode: default
    status_any:
      - PASS
      - GAP
  - agent: security
    allowed_supporting:
      - cascade-software-architect:review-architecture
    context_sources:
      - docs/product/requirements.md
      - docs/specs/persona-simulation-governance/contract.md
      - docs/patterns/boundaries/index.md
    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 2
    max_output_chars: 7000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: cascade-security:secure-design
    product_context_required: true
    prompt: Perform a read-only security design review of the product simulation adapter and its cross-interface permissions. Use docs/product/requirements.md, docs/specs/persona-simulation-governance/contract.md, and docs/patterns/boundaries/index.md; distinguish evidence from assumptions and identify the appropriate next route.
    reasoning_effort: high
    required_evidence_paths:
      - docs/product/requirements.md
      - docs/specs/persona-simulation-governance/contract.md
      - docs/patterns/boundaries/index.md
    sandbox_mode: read-only
    status_any:
      - PASS
      - GAP
  - agent: harness-evaluator
    allowed_supporting:
      - cascade-evals:evaluate
    context_sources:
      - .codex/agents/harness-evaluator/AGENT.md
      - .codex/plugins/cascade-evals/skills/harness-evaluation/SKILL.md
    max_commands: 8
    max_loaded_roles: 1
    max_loaded_skills: 2
    max_output_chars: 5000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: cascade-evals:harness-evaluation
    product_context_required: false
    prompt: Determine whether a claimed successful agent outcome is eligible for independent harness judgment when only the scenario description is available and the raw output, normalized trace, and immutable run packet are missing. Remain read-only and do not execute or repair the target.
    reasoning_effort: high
    required_evidence_paths:
      - .codex/agents/harness-evaluator/AGENT.md
      - .codex/plugins/cascade-evals/skills/harness-evaluation/SKILL.md
    sandbox_mode: read-only
    status_any:
      - BLOCKED
      - GAP
  - agent: simulation-operator
    allowed_supporting: []
    context_sources:
      - .codex/agents/simulation-operator/AGENT.md
      - .codex/plugins/cascade-simulations/skills/execute-simulation-campaign/SKILL.md
      - product-evals/campaigns/simulation-contract-smoke.yaml
    max_commands: 8
    max_loaded_roles: 1
    max_loaded_skills: 1
    max_output_chars: 5000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: cascade-simulations:execute-simulation-campaign
    product_context_required: false
    prompt: Preflight the simulation-contract-smoke campaign for execution, but treat approval and resolved runtime intake as unavailable. Do not execute, widen permissions, judge results, or edit artifacts; report the precise blocking inputs.
    reasoning_effort: medium
    required_evidence_paths:
      - .codex/agents/simulation-operator/AGENT.md
      - .codex/plugins/cascade-simulations/skills/execute-simulation-campaign/SKILL.md
      - product-evals/campaigns/simulation-contract-smoke.yaml
    sandbox_mode: workspace-write
    status_any:
      - BLOCKED
      - GAP
  - agent: simulation-evaluator
    allowed_supporting:
      - cascade-simulations:simulation-review
    context_sources:
      - .codex/agents/simulation-evaluator/AGENT.md
      - .codex/plugins/cascade-evals/skills/simulation-evaluation/SKILL.md
      - product-evals/campaigns/simulation-contract-smoke.yaml
    max_commands: 8
    max_loaded_roles: 1
    max_loaded_skills: 2
    max_output_chars: 5000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: cascade-evals:simulation-evaluation
    product_context_required: false
    prompt: Evaluate whether the simulation-contract-smoke campaign supports a product claim when the campaign definition exists but no frozen run package, oracle results, or independent judgments are supplied. Apply mechanical gates first, remain read-only, and do not infer release eligibility.
    reasoning_effort: high
    required_evidence_paths:
      - .codex/agents/simulation-evaluator/AGENT.md
      - .codex/plugins/cascade-evals/skills/simulation-evaluation/SKILL.md
      - product-evals/campaigns/simulation-contract-smoke.yaml
    sandbox_mode: read-only
    status_any:
      - BLOCKED
      - GAP
schema_version: 1
