      - docs/specs/persona-simulation-governance/contract.md
    max_commands: 10
    max_loaded_roles: 1
    max_loaded_skills: 3
    max_output_chars: 7000
    model: gpt-5.6-sol
    next_route: ""
    primary_skill: synthesis-to-spec
    product_context_required: true
    prompt: Using docs/product/requirements.md, docs/product/journeys.md, and docs/specs/persona-simulation-governance/contract.md, separate validated product facts from assumptions and missing evidence, then prepare a concise plan-ready synthesis. Do not invent research or silently promote simulation findings into product truth.
    reasoning_effort: high
    required_evidence_paths:
      - docs/product/requirements.md
      - docs/product/journeys.md
      - docs/specs/persona-simulation-governance/contract.md
