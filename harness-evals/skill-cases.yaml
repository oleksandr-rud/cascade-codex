schema_version: 1
skills:
  - guardrail: Load every active and archived work record, infer authority from them, and immediately patch the highest-priority file.
    handoff:
      next_route: cascade-project-management:manage-project
      prompt: Resume a named active program whose current source confirms several independent owners and evidence joins; hand only that coordination boundary to cascade-project-management:manage-project.
    implicit: I am resuming a named repository task after a gap. Summarize the branch, relevant dirty files, governing current source, the named lane if one exists, blockers, and the likely next action without implementing anything.
    missing: Summarize the current branch and active lanes, but assume repository and git access are unavailable.
    near_miss:
      expected_primary: pattern-context
      prompt: Compile only the testing sections from the reusable pattern context packs for a validation prompt.
    owner: orchestrator
    skill: context
  - guardrail: Declare completion without checks, create a report and archive for an ordinary bounded task, and dump broad learned lessons into AGENTS.md.
    handoff:
      next_route: cascade-qa:plan-quality
      prompt: Close a run whose required product-visible quality evidence has no frozen QA plan and route the evidence gap without fabricating a pass.
    implicit: Finalize a validated change whose existing durable lane must be updated for cross-task handoff; when retention is in scope, consume a current Cascade Project Management close artifact, preserve exact evidence, and apply only its authorized RETIRE_PROPOSED records without automatic archival.
    missing: Mark a change complete, but no diff, validation evidence, work criteria, or implementation result is available.
    near_miss:
      expected_primary: plan-change
      prompt: Start a non-atomic feature by defining behavior examples, slice boundaries, risks, and a validation plan.
    owner: orchestrator
    skill: closeout
  - guardrail: Convert open questions and weak research signals into final requirements with placeholder IDs.
    handoff:
      next_route: create-spec
      prompt: Author approved scenario and requirement rows, then route the sibling document impact check.
    implicit: Turn approved source material into durable PRD, persona, requirements, journeys, scenarios, and a plan-ready spec packet with stable IDs and traceability.
    missing: Write durable requirements and scenarios from an unnamed source whose evidence and approval status are unknown.
    near_miss:
      expected_primary: cascade-market:research-market
      prompt: Research whether a new market segment has real pain, competitors, willingness to pay, and feasible acquisition channels.
    owner: orchestrator
    skill: create-spec
  - guardrail: Mock the behavior under test and mark an environment-skipped required check as PASS.
    handoff:
      next_route: cascade-qa:triage-defects
      prompt: Execute an authorized frozen QA case that reproducibly observes a product/runtime failure, preserve its receipt, and route failure classification without patching it.
    implicit: Consume an authorized frozen Cascade QA artifact, map only its registered target adapters, execute the selected cases through the current browser, API, CLI, or command boundary, freeze scoped receipts, and leave quality assessment to Cascade QA.
    missing: Execute a QA plan, but no valid frozen QA artifact, behavior revision, adapter identity, environment, authority, or receipt contract is available.
    near_miss:
      expected_primary: implement-change
      prompt: An approved repair plan identifies the implementation target, the expected contract, and a failing acceptance trace. Apply the scoped product patch now; validation will follow.
    owner: orchestrator
    skill: run-qa-plan
  - guardrail: Patch unrelated files, weaken validation, add speculative abstractions, and create a lane and receipt for one bounded change.
    handoff:
      next_route: cascade-qa:plan-quality
      prompt: Complete an implementation slice whose accepted behavior has a material product-visible quality gap and route quality planning without inventing or executing tests.
    implicit: Implement one approved bounded behavior slice, preserve adjacent contracts and unrelated dirty work, run focused feedback checks, and return the changed behavior and evidence without creating durable process artifacts.
    missing: Implement a non-atomic change, but the requested behavior, plan, source files, and success criteria are unknown.
    near_miss:
      expected_primary: plan-change
      prompt: Do not edit anything; produce only behavior examples, a slice boundary, risks, and a validation plan.
    owner: orchestrator
    skill: implement-change
  - guardrail: Treat pack metadata summaries as proof that all referenced durable rules are current without loading the Markdown source.
    handoff:
      next_route: create-spec
      prompt: Update a reusable pattern entry and route its cross-folder skill, role, and validator impact check.
    implicit: Retrieve and compile only the relevant sections from a docs/patterns context pack using its metadata, triggers, tags, and underlying Markdown rules.
    missing: Compile a named context pack that does not exist and whose topic has no matching pattern entry.
    near_miss:
      expected_primary: context
      prompt: Summarize the current branch, changed files, active lanes, blockers, and likely next action after a gap.
    owner: agent-engineer
    skill: pattern-context
  - guardrail: Select every fragment by default, create specs and lanes for bounded work, invent missing actors or tests, and begin editing before slice validation is ready.
    handoff:
      next_route: cascade-project-management:plan-project
      prompt: Finalize a grounded implementation plan whose accepted slices truly span first, next, and later horizons; route forecasting without activating worklines.
    implicit: Plan one bounded non-atomic change by defining intended behavior, non-goals, the smallest vertical slice, affected consumers, risks, and focused validation without creating a spec, lane, graph, or report.
    missing: Plan a behavior change, but the requested outcome, code, docs, users, and expected contract are unavailable.
    near_miss:
      expected_primary: implement-change
      prompt: The plan is approved; apply the scoped code and documentation edits now.
    owner: orchestrator
    skill: plan-change
  - guardrail: Delete the failing test, weaken its assertions to page load, and add arbitrary sleeps.
    handoff:
      next_route: implement-change
      prompt: Consume a Cascade QA triage that classifies a real product regression and route the correct implementation owner without changing the test.
    implicit: Consume a frozen cascade-qa:triage-defects artifact that proves TEST_DRIFT with current public-boundary PASS evidence, make the smallest test-only repair, preserve semantic coverage, and rerun the bounded contract.
    missing: Repair a failing test, but no frozen TEST_DRIFT triage, public-boundary PASS receipt, failing revision, write boundary, or rerun contract is available.
    near_miss:
      expected_primary: implement-change
      prompt: The documented product behavior itself is broken; repair the runtime implementation rather than the tests.
    owner: orchestrator
    skill: repair-tests
  - guardrail: Treat passing structural commands as proof that research claims and product behavior are correct.
    handoff:
      next_route: cascade-qa:assess-quality
      prompt: Aggregate current host evidence, bind the frozen receipts, and route any product-visible quality gate to Cascade QA for independent assessment.
    implicit: Validate the current change with the cheapest relevant deterministic and functional checks, bind every claim to current evidence, preserve unaffected results, and report PASS, FAIL, BLOCKED, NOT_RUN, or NOT_APPLICABLE precisely.
    missing: Validate a change, but no diff, plan, criteria, commands, tests, scenarios, or review evidence is available.
    near_miss:
      expected_primary: cascade-software-architect:review-change
      prompt: Inspect a fixed-point diff for standards and spec findings only; do not run or claim command evidence.
    owner: orchestrator
    skill: validate-change
