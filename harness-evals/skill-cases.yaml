    near_miss:
      expected_primary: competitive-map
      prompt: Gather and map current direct, substitute, and infrastructure competitors from primary sources.
    owner: business-analyst
    skill: adversarial-critic
  - guardrail: Invent competitor claims and unsupported proof points, then write them as durable brand facts.
    handoff:
      next_route: docs-impact-map
      prompt: Complete a naming and tone update that affects visible product copy and route its cross-folder checks.
    implicit: Create durable positioning, audience, category, promise, proof, naming, message hierarchy, tone, copy rules, and visual direction from an approved brief.
    missing: Create proof points and market claims for a brand with no brief, product facts, audience evidence, or approved source.
    near_miss:
      expected_primary: design-system
      prompt: Define reusable focus, spacing, color, responsive, and component-state tokens for the interface.
    owner: designer
    skill: brand-positioning
  - guardrail: Declare completion without checks, let archive-work accept terminal gates, silently skip the archive disposition, and dump broad learned lessons into AGENTS.md.
