files:
  - content:
      calibration_file: product-evals/calibrations/{{SIMULATION_ID}}-framework-v1.yaml
      dataset_file: product-evals/simulations/product/{{SIMULATION_ID}}/datasets/cases.yaml
      id: "{{SIMULATION_ID}}"
      metric_files:
        - product-evals/metrics/{{SIMULATION_ID}}-task-success-v1.yaml
      population_files:
        - product-evals/simulations/product/{{SIMULATION_ID}}/populations/default.yaml
      purpose: Bootstrap a deterministic, stateful simulation contract before target-specific calibration.
      scenario_files:
        - product-evals/simulations/product/{{SIMULATION_ID}}/scenarios/happy-path.yaml
      schema_version: 1
      simulation_scope: product
      title: "{{TITLE}}"
      treatment_files:
        - product-evals/treatments/{{SIMULATION_ID}}-baseline-v1.yaml
        - product-evals/treatments/{{SIMULATION_ID}}-candidate-v1.yaml
      world_file: product-evals/simulations/product/{{SIMULATION_ID}}/worlds/default.yaml
    path: product-evals/simulations/product/{{SIMULATION_ID}}/manifest.yaml
  - content:
      actors:
        - behavior:
            risk_profile: standard
          id: "{{SIMULATION_ID}}-standard-actor"
          slices:
            - standard
          weight: 0.8
        - behavior:
            risk_profile: risk
          id: "{{SIMULATION_ID}}-risk-actor"
          slices:
            - risk
          weight: 0.2
      id: "{{SIMULATION_ID}}-actors-v1"
      schema_version: 1
      source:
        description: Starter actors generated by Cascade with test-allocation weights only; replace or calibrate before target-project claims and never interpret these weights as prevalence.
        kind: synthetic
        minimized: true
    path: product-evals/simulations/product/{{SIMULATION_ID}}/populations/default.yaml
  - content:
      actor_ids:
        - "{{SIMULATION_ID}}-standard-actor"
        - "{{SIMULATION_ID}}-risk-actor"
      claim_ids:
        - "{{SIMULATION_ID}}-state-transition"
        - "{{SIMULATION_ID}}-release-eligibility"
      goal: Move the starter world from pending to completed.
      id: "{{SIMULATION_ID}}-happy-path-v1"
      initial_state:
        workflow.status: pending
      schema_version: 1
      stop_conditions:
        - workflow.status equals completed
    path: product-evals/simulations/product/{{SIMULATION_ID}}/scenarios/happy-path.yaml
  - content:
      allowed_actions:
        - assert
        - set
        - increment
        - deny
        - fail
      cleanup:
        reset_to_fixture: true
      fixture_file: product-evals/simulations/product/{{SIMULATION_ID}}/worlds/default.fixture.yaml
      id: "{{SIMULATION_ID}}-world-v1"
      negative_behaviors:
        - unknown actions are denied by default
        - state assertions fail on mismatched values
        - cleanup resets the world to its frozen fixture
      schema_version: 1
    path: product-evals/simulations/product/{{SIMULATION_ID}}/worlds/default.yaml
  - content:
      workflow:
        status: pending
    path: product-evals/simulations/product/{{SIMULATION_ID}}/worlds/default.fixture.yaml
  - content:
      cases:
        - actor_id: "{{SIMULATION_ID}}-standard-actor"
          id: "{{SIMULATION_ID}}-development-standard"
          partition: development
          scenario_id: "{{SIMULATION_ID}}-happy-path-v1"
          slices:
            - standard
        - actor_id: "{{SIMULATION_ID}}-risk-actor"
          id: "{{SIMULATION_ID}}-regression-risk"
          partition: regression
          scenario_id: "{{SIMULATION_ID}}-happy-path-v1"
          slices:
            - risk
        - actor_id: "{{SIMULATION_ID}}-standard-actor"
          id: "{{SIMULATION_ID}}-holdout-standard"
          partition: holdout
          scenario_id: "{{SIMULATION_ID}}-happy-path-v1"
          slices:
            - standard
        - actor_id: "{{SIMULATION_ID}}-standard-actor"
          id: "{{SIMULATION_ID}}-calibration-standard-a"
          partition: calibration-reference
          scenario_id: "{{SIMULATION_ID}}-happy-path-v1"
          slices:
            - standard
        - actor_id: "{{SIMULATION_ID}}-risk-actor"
          id: "{{SIMULATION_ID}}-calibration-risk-a"
          partition: calibration-reference
          scenario_id: "{{SIMULATION_ID}}-happy-path-v1"
          slices:
            - risk
        - actor_id: "{{SIMULATION_ID}}-standard-actor"
          id: "{{SIMULATION_ID}}-calibration-standard-b"
          partition: calibration-reference
          scenario_id: "{{SIMULATION_ID}}-happy-path-v1"
          slices:
            - standard
      id: "{{SIMULATION_ID}}-cases-v1"
      leakage_policy: exclusive-case-identity
      schema_version: 1
    path: product-evals/simulations/product/{{SIMULATION_ID}}/datasets/cases.yaml
  - content:
      aggregation: mean
      direction: higher-is-better
      hard_gate: true
      id: "{{SIMULATION_ID}}-task-success-v1"
      kind: deterministic
      required_slices:
        - standard
        - risk
      schema_version: 1
      source:
        oracle_id: "{{SIMULATION_ID}}-completed-v1"
      uncertainty: none
      unit: ratio
    path: product-evals/metrics/{{SIMULATION_ID}}-task-success-v1.yaml
  - content:
      baseline: true
      id: "{{SIMULATION_ID}}-baseline-v1"
      schema_version: 1
      target:
        harness_digest: "{{HARNESS_DIGEST}}"
        model: deterministic-starter
        prompt_digest: "{{BASELINE_PROMPT_DIGEST}}"
        source_revision: replace-with-baseline-revision
        tool_digest: "{{BASELINE_TOOL_DIGEST}}"
    path: product-evals/treatments/{{SIMULATION_ID}}-baseline-v1.yaml
  - content:
      baseline: false
      id: "{{SIMULATION_ID}}-candidate-v1"
      schema_version: 1
      target:
        harness_digest: "{{HARNESS_DIGEST}}"
        model: deterministic-starter
        prompt_digest: "{{CANDIDATE_PROMPT_DIGEST}}"
        source_revision: replace-with-candidate-revision
        tool_digest: "{{CANDIDATE_TOOL_DIGEST}}"
    path: product-evals/treatments/{{SIMULATION_ID}}-candidate-v1.yaml
  - content:
      dataset_id: "{{SIMULATION_ID}}-cases-v1"
      framework_fixture: true
      id: "{{SIMULATION_ID}}-framework-calibration-v1"
      metric_ids:
        - "{{SIMULATION_ID}}-task-success-v1"
      reference:
        kind: framework-fixture
        label_digest: "{{REFERENCE_LABEL_DIGEST}}"
        reference_window_end: "{{REFERENCE_WINDOW_END}}"
        reviewer_identity: replace-with-independent-reviewer
      reference_scores_file: product-evals/calibrations/fixtures/{{SIMULATION_ID}}-framework.reference.yaml
      required_slices:
        - standard
        - risk
      schema_version: 1
      simulated_scores_file: product-evals/calibrations/fixtures/{{SIMULATION_ID}}-framework.simulated.yaml
      simulation_id: "{{SIMULATION_ID}}"
      staleness_days: 365
      thresholds:
        minimum_human_agreement: 0.8
        minimum_linear_correlation: 0.9
        minimum_rank_correlation: 0.9
        minimum_samples: 3
      treatment_ids:
        - "{{SIMULATION_ID}}-baseline-v1"
        - "{{SIMULATION_ID}}-candidate-v1"
    path: product-evals/calibrations/{{SIMULATION_ID}}-framework-v1.yaml
  - content:
      - case_id: "{{SIMULATION_ID}}-calibration-standard-a"
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-baseline-v1"
        value: 0.4
      - case_id: "{{SIMULATION_ID}}-calibration-risk-a"
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: risk
        treatment_id: "{{SIMULATION_ID}}-baseline-v1"
        value: 0.3
      - case_id: "{{SIMULATION_ID}}-calibration-standard-b"
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-baseline-v1"
        value: 0.5
      - case_id: "{{SIMULATION_ID}}-calibration-standard-a"
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-candidate-v1"
        value: 0.8
      - case_id: "{{SIMULATION_ID}}-calibration-risk-a"
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: risk
        treatment_id: "{{SIMULATION_ID}}-candidate-v1"
        value: 0.7
      - case_id: "{{SIMULATION_ID}}-calibration-standard-b"
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-candidate-v1"
        value: 0.9
    path: product-evals/calibrations/fixtures/{{SIMULATION_ID}}-framework.simulated.yaml
  - content:
      - case_id: "{{SIMULATION_ID}}-calibration-standard-a"
        human_label: 0
        judge_label: 0
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-baseline-v1"
        value: 0.35
      - case_id: "{{SIMULATION_ID}}-calibration-risk-a"
        human_label: 0
        judge_label: 0
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: risk
        treatment_id: "{{SIMULATION_ID}}-baseline-v1"
        value: 0.3
      - case_id: "{{SIMULATION_ID}}-calibration-standard-b"
        human_label: 0
        judge_label: 0
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-baseline-v1"
        value: 0.4
      - case_id: "{{SIMULATION_ID}}-calibration-standard-a"
        human_label: 1
        judge_label: 1
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-candidate-v1"
        value: 0.78
      - case_id: "{{SIMULATION_ID}}-calibration-risk-a"
        human_label: 1
        judge_label: 1
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: risk
        treatment_id: "{{SIMULATION_ID}}-candidate-v1"
        value: 0.68
      - case_id: "{{SIMULATION_ID}}-calibration-standard-b"
        human_label: 1
        judge_label: 1
        metric_id: "{{SIMULATION_ID}}-task-success-v1"
        slice: standard
        treatment_id: "{{SIMULATION_ID}}-candidate-v1"
        value: 0.88
    path: product-evals/calibrations/fixtures/{{SIMULATION_ID}}-framework.reference.yaml
  - content:
      budgets:
        max_actions: 4
        max_output_bytes: 65536
        required_dimensions:
          - action_count
          - output_bytes
      effect: ALLOW
      id: "{{SIMULATION_ID}}-allow-state-actions-v1"
      reason: The generated deterministic starter permits declared in-memory state transitions only.
      redaction_profile: no-secrets-v1
      schema_version: 2
      scope:
        action_paths:
          - workflow.status
        action_types:
          - assert
          - set
        campaign_ids:
          - "{{SIMULATION_ID}}-smoke"
        driver_types:
          - fake
        task_ids:
          - "{{TASK_ID}}-STATE-SMOKE"
        task_kinds:
          - agent-response
      version: 2.0.0
    path: product-evals/policies/{{SIMULATION_ID}}-allow-state-actions-v1.yaml
  - content:
      expected: completed
      id: "{{SIMULATION_ID}}-completed-v1"
      path: workflow.status
      schema_version: 1
      type: state-equals
    path: product-evals/oracles/{{SIMULATION_ID}}-completed-v1.yaml
  - content:
      actions:
        - path: workflow.status
          type: assert
          value: pending
        - path: workflow.status
          type: set
          value: completed
      driver:
        adapter: builtin-fake
        type: fake
      id: "{{TASK_ID}}-STATE-SMOKE"
      kind: agent-response
      oracle_ids:
        - "{{SIMULATION_ID}}-completed-v1"
      policy_ids:
        - "{{SIMULATION_ID}}-allow-state-actions-v1"
      required: true
      schema_version: 1
      timeout_ms: 1000
    path: product-evals/tasks/{{TASK_ID}}-STATE-SMOKE.yaml
  - content:
      assertion: The generated deterministic world applies its declared state transition and exposes the final state to its oracle.
      class: mechanical-behavior
      evidence_requirements:
        - source-manifest
        - execution-receipt
        - task-result
        - trajectory
        - policy-decisions
        - oracle
        - cleanup
      id: "{{SIMULATION_ID}}-state-transition"
      population_authority: none
      required_metric_ids: []
      required_oracle_ids:
        - "{{SIMULATION_ID}}-completed-v1"
      required_policy_ids:
        - "{{SIMULATION_ID}}-allow-state-actions-v1"
      requires_calibration: false
      schema_version: 1
      scope:
        simulation_id: "{{SIMULATION_ID}}"
        world_id: "{{SIMULATION_ID}}-world-v1"
    path: product-evals/claims/{{SIMULATION_ID}}-state-transition.yaml
  - content:
      assertion: A current non-fixture calibration supports release eligibility for the exact target treatment and source identity.
      class: release-eligibility
      evidence_requirements:
        - source-manifest
        - execution-receipt
        - policy-decisions
        - oracle
        - cleanup
        - calibration-receipt
      id: "{{SIMULATION_ID}}-release-eligibility"
      population_authority: estimated-prevalence
      required_metric_ids:
        - "{{SIMULATION_ID}}-task-success-v1"
      required_oracle_ids:
        - "{{SIMULATION_ID}}-completed-v1"
      required_policy_ids:
        - "{{SIMULATION_ID}}-allow-state-actions-v1"
      requires_calibration: true
      schema_version: 1
      scope:
        population_id: "{{SIMULATION_ID}}-actors-v1"
        simulation_id: "{{SIMULATION_ID}}"
        target_project: required
    path: product-evals/claims/{{SIMULATION_ID}}-release-eligibility.yaml
  - content:
      artifact_type: cascade-simulation-seed-binding
      campaign_id: "{{SIMULATION_ID}}-smoke"
      campaign_sha256: "{{CAMPAIGN_SHA256}}"
      id: "{{SIMULATION_ID}}-seed-binding-v1"
      mappings: []
      schema_version: 1
      source:
        request_digest: null
        source_digest: null
        task_envelope_id: null
        task_envelope_revision: null
      status: DRAFT
    path: product-evals/intakes/product/seed-bindings/{{SIMULATION_ID}}-smoke.json
  - content:
      artifact_type: cascade-simulation-intake
      blockers:
        - compile a current Task Envelope and product brief into this intake before execution
      campaign_id: "{{SIMULATION_ID}}-smoke"
      claims: []
      gaps:
        - product context and exact action-policy equality have not been compiled
      id: SI-{{INTAKE_ID}}
      invalidation:
        - task envelope revision
        - product brief or generated output digest
        - campaign task or policy digest
      produced_at: "{{REFERENCE_WINDOW_END}}"
      product_context: null
      schema_version: 6
      scope: product
      seed_binding: null
      status: DRAFT
      task_envelope: null
      tasks: []
    path: product-evals/intakes/product/{{SIMULATION_ID}}-smoke.json
  - content:
      claim_files:
        - product-evals/claims/{{SIMULATION_ID}}-state-transition.yaml
        - product-evals/claims/{{SIMULATION_ID}}-release-eligibility.yaml
      evaluation_profile_file: product-evals/rubrics/deterministic-fixture-v1.yaml
      id: "{{SIMULATION_ID}}-smoke"
      intake_file: product-evals/intakes/product/{{SIMULATION_ID}}-smoke.json
      oracle_files:
        - product-evals/oracles/{{SIMULATION_ID}}-completed-v1.yaml
      owner_lane: "{{OWNER_LANE}}"
      policy_files:
        - product-evals/policies/{{SIMULATION_ID}}-allow-state-actions-v1.yaml
      purpose: Validate the generated deterministic simulation package without external services.
      schema_version: 1
      seed_binding_file: product-evals/intakes/product/seed-bindings/{{SIMULATION_ID}}-smoke.json
      session:
        lease_ttl_ms: 60000
        max_checkpoint_bytes: 1048576
        max_duration_ms: 300000
        max_parallel_steps: 1
        max_step_duration_ms: 15000
        max_steps: 100
        max_steps_per_episode: 25
        max_surfaces: 4
      simulation_file: product-evals/simulations/product/{{SIMULATION_ID}}/manifest.yaml
      specialized_evaluation: null
      task_files:
        - product-evals/tasks/{{TASK_ID}}-STATE-SMOKE.yaml
      tier: deterministic-fixture
      title: "{{TITLE}} smoke"
    path: product-evals/campaigns/{{SIMULATION_ID}}-smoke.yaml
schema_version: 1
template_id: cascade-simulation-starter-v1
