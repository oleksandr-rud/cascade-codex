model = "gpt-6-astra"
model_reasoning_effort = "high"

[harness]
name = "cascade"
version = "1.0.0"
bridge = "CODEX.md"
config_template = "harness.config.example.yaml"

[cascade]
admission_command = "scripts/cascade.ts admission assess"
admission_policy_bundle = ".codex/task-admission/policies/core.yaml"
admission_hook = ".codex/hooks.json"
fallback_non_atomic = [
  "context",
  "plan-change",
  "implement-change",
  "validate-change",
]
conditional_discovery = "context"
conditional_market_research = "cascade-discovery:research-market"
conditional_market_experiments = "cascade-discovery:design-market-experiments"
conditional_spec_persistence = "create-spec"
conditional_iteration_planning = "cascade-workflows:plan-project"
conditional_project_management = "cascade-workflows:manage-project"
conditional_project_closeout = "cascade-workflows:close-project"
conditional_quality_planning = "cascade-quality:plan-quality"
conditional_test_design = "cascade-quality:design-tests"
conditional_quality_assessment = "cascade-quality:assess-quality"
conditional_defect_triage = "cascade-quality:triage-defects"
conditional_harness_evaluation = "cascade-quality:harness-evaluation"
optional_dynamic_actor_simulation = "cascade-simulations:simulate"
plugin_capability_catalog = ".codex/plugin-capabilities.generated.json"
conditional_capability_selection = "cascade-workflows:select-capabilities"
plugin_coordinator_validator = "scripts/cascade/plugin-workflow.ts"
conditional_simulation_campaigns = "cascade-simulations:manage-simulation-campaign"
conditional_simulation_execution = "cascade-simulations:run-simulation-campaign"
conditional_simulation_evaluation = "cascade-quality:simulation-evaluation"
test_repair_condition = "only after cascade-quality:triage-defects proves TEST_DRIFT"
exception_paths = ["cascade-workflows:define-work-item"]

[cascade.plugin_skills]
prompt = "cascade-prompt:prompt"
capability_selection = "cascade-workflows:select-capabilities"
workflow_plan = "cascade-workflows:plan-workflow"
software_architecture = "cascade-engineering:architect-software-system"
architecture_patterns = "cascade-engineering:select-architecture-patterns"
architecture_review = "cascade-engineering:review-architecture"
change_review = "cascade-engineering:review-change"
agent_architecture = "cascade-ai-architect:architect-ai-system"
agent_capabilities = "cascade-ai-architect:map-agent-capabilities"
agent_blueprint = "cascade-ai-architect:design-agent-blueprint"
agent_workflow = "cascade-ai-architect:design-agent-workflow"
langgraph_workflow = "cascade-ai-architect:bind-agent-runtime"
agent_roles = "cascade-ai-architect:build-agent-roles"
agent_skills = "cascade-ai-architect:build-agent-skills"
agent_prompt = "cascade-ai-architect:prepare-agent-prompt"
agent_persona_requirements = "cascade-ai-architect:derive-persona-requirements"
agent_system_evaluation = "cascade-ai-architect:prepare-agent-evaluation"
agent_improvement = "cascade-ai-architect:run-improvement-cycle"
harness_audit = "cascade-engineering:audit-harness"
harness_adaptation = "cascade-engineering:adapt-harness"
harness_maintenance = "cascade-engineering:maintain-harness"
harness_asset_integration = "cascade-engineering:integrate-agent-assets"
git_integration = "cascade-engineering:pull-and-integrate"
persona_build = "cascade-discovery:build-persona"
persona_compile = "cascade-discovery:compile-persona"
persona_evaluate = "cascade-discovery:evaluate-persona"
market_research = "cascade-discovery:research-market"
market_opportunity = "cascade-discovery:evaluate-market-opportunity"
market_experiment = "cascade-discovery:design-market-experiments"
marketing_brand = "cascade-discovery:brand-positioning"
marketing_growth = "cascade-discovery:plan-growth"
product_lifecycle = "cascade-discovery:manage-product-lifecycle"
product_definition = "cascade-discovery:define-product"
product_validation = "cascade-discovery:validate-product"
simulation_execute = "cascade-simulations:simulate"
simulation_campaign_manage = "cascade-simulations:manage-simulation-campaign"
simulation_campaign_execute = "cascade-simulations:run-simulation-campaign"
simulation_review = "cascade-simulations:simulation-review"
simulation_actor = "cascade-simulations:simulation-actor"
simulation_persona = "cascade-simulations:simulation-persona"
simulation_brief = "cascade-simulations:simulation-brief"
simulation_outcome = "cascade-simulations:simulation-outcome"
simulation_adapter = "cascade-simulations:simulation-adapter"
evaluation = "cascade-quality:evaluate"
judge_builder = "cascade-quality:build-judge"
prompt_evaluation = "cascade-quality:prompt-evaluation"
agent_evaluation = "cascade-quality:agent-evaluation"
simulation_evaluation = "cascade-quality:simulation-evaluation"
harness_evaluation = "cascade-quality:harness-evaluation"
design_flow = "cascade-design:ux-flow-review"
design_accessibility = "cascade-design:accessibility-review"
design_visual = "cascade-design:visual-qa"
design_system = "cascade-design:design-system"
design_creation = "cascade-design:create-design"
security_codebase = "cascade-security:codebase-audit"
security_auth = "cascade-security:auth-analysis"
security_design = "cascade-security:secure-design"
work_item_definition = "cascade-workflows:define-work-item"
project_plan = "cascade-workflows:plan-project"
project_manage = "cascade-workflows:manage-project"
project_close = "cascade-workflows:close-project"
qa_plan = "cascade-quality:plan-quality"
qa_design_tests = "cascade-quality:design-tests"
qa_assess = "cascade-quality:assess-quality"
qa_triage = "cascade-quality:triage-defects"

# Agent concurrency is intentionally left to the active Codex runtime so this
# project config remains portable across supported client versions.
[memory]
glossary = "docs/glossary.md"
work = "docs/work"
research = "docs/patterns/context-memory/index.md"
product = "docs/product"
specs = "docs/specs"
patterns = "docs/patterns"
pattern_context_builder = "scripts/cascade/patterns.ts"
pattern_context_packs = "docs/patterns/*/*.pack.yaml"
backlog = "docs/backlog"

[harness_evals]
planning_model = "gpt-6-astra"
execution_model = "gpt-6-astra"
judge_model = "gpt-6-astra"
default_model_profile = "execution"
cases = "harness-evals/skill-cases.yaml"
interactions = "harness-evals/interactions.yaml"
catalog = "harness-evals/scenarios.generated.json"
response_schema = "harness-evals/response.schema.json"
judge_schema = "harness-evals/judge-response.schema.json"
judge_profiles = "harness-evals/judge-profiles.yaml"
rubrics = "harness-evals/rubrics"
runner = "scripts/cascade/evals.ts"
artifacts = ".artifacts/harness-evals"

[campaigns]
registry = "product-evals/campaigns"
schema = "product-evals/campaigns/schema.json"
runner = "scripts/cascade/campaigns.ts"
artifacts = ".artifacts/product-evals"
browser_runner = ".codex/harness-tooling/playwright.config.ts"

[product_briefs]
catalog = "docs/product/catalog.yaml"
catalog_schema = "docs/product/catalog.schema.json"
manifest_schema = "docs/specs/brief-manifest.schema.json"
manifests = "docs/specs/*/brief.yaml"
runner = "scripts/cascade/briefs.ts"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20

[mcp_servers.cascade_workspace]
command = "npx"
args = ["--offline", "--yes", "bun@1.3.3", "scripts/cascade/workspace-mcp.ts"]
cwd = "."
startup_timeout_sec = 20

[harness_agents]
default_orchestrator = "orchestrator"
onboarding = "agent-engineer"
harness_design = "agent-engineer"
business_analysis = "orchestrator"
security_review = "security"
design_review = "orchestrator"
frontend_implementation = "frontend-engineer"
design_creation = "product-designer"
software_implementation = "software-engineer"
code_review = "code-reviewer"
simulation_execution = "simulation-operator"
simulation_evaluation = "simulation-evaluator"
