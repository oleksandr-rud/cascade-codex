model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[harness]
name = "cascade"
version = "1.0.0"
bridge = "CODEX.md"
config_template = "harness.config.example.yaml"

[cascade]
default = [
  "context",
  "ingest-spec",
  "docs-impact-map",
  "pattern-context",
  "orchestrate-work",
  "plan-change",
  "functional-qa",
  "implement-change",
  "review-change",
  "validate-change",
  "test-autorepair",
  "closeout",
]
conditional_discovery = "discover"
conditional_business_analysis = "market-validation"
conditional_spec_composition = "compose-spec"
conditional_harness_evaluation = "harness-evaluation"
test_autorepair_condition = "only if stale tests"
exception_paths = ["issue-intake"]

[agents]
max_threads = 6
max_depth = 1

[memory]
glossary = "docs/glossary.md"
work = "docs/work"
research = "docs/patterns/context-memory/index.md"
product = "docs/product"
specs = "docs/specs"
patterns = "docs/patterns"
pattern_context_builder = "scripts/build_pattern_context_pack.py"
pattern_context_packs = "docs/patterns/*/*.pack.yaml"
backlog = "docs/backlog"

[harness_evals]
planning_model = "gpt-5.6-sol"
execution_model = "gpt-5.6-terra"
golden_model = "gpt-5.6-sol"
default_model_profile = "execution"
cases = "evals/harness/skill-cases.json"
interactions = "evals/harness/interactions.json"
catalog = "evals/harness/scenarios.generated.json"
response_schema = "evals/harness/response.schema.json"
judge_schema = "evals/harness/judge-response.schema.json"
runner = "scripts/run_harness_evals.py"
artifacts = ".artifacts/harness-evals"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20

[harness_agents]
default_orchestrator = "orchestrator"
onboarding = "project-onboarder"
harness_design = "agent-engineer"
business_analysis = "business-analyst"
security_review = "security"
design_review = "designer"
golden_evaluation = "harness-evaluator"
