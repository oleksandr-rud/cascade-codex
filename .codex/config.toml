model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[harness]
name = "cascade"
version = "1.0.0"
bridge = "CODEX.md"
config_template = "harness.config.example.yaml"

[cascade]
admission_command = "scripts/cascade.ts admission assess"
admission_policy_bundle = ".codex/task-admission/policies/core.json"
admission_hook = ".codex/hooks.json"
fallback_non_atomic = [
  "context",
  "ingest-spec",
  "docs-impact-map",
  "pattern-context",
  "orchestrate-work",
  "plan-change",
  "functional-qa",
  "implement-change",
  "review-change",
  "validate-change",
  "test-autorepair",
  "closeout",
]
conditional_discovery = "discover"
conditional_business_analysis = "market-validation"
conditional_spec_composition = "compose-spec"
conditional_harness_evaluation = "harness-evaluation"
conditional_simulation_campaigns = "simulation-campaigns"
conditional_simulation_execution = "simulation-execution"
conditional_simulation_evaluation = "simulation-evaluation"
test_autorepair_condition = "only if stale tests"
exception_paths = ["issue-intake"]

[agents]
# Internal root-plus-subagent execution capacity only. This value neither
# counts user-visible Codex tasks nor authorizes automatic dispatch.
max_threads = 6
max_depth = 1

[memory]
glossary = "docs/glossary.md"
work = "docs/work"
research = "docs/patterns/context-memory/index.md"
product = "docs/product"
specs = "docs/specs"
patterns = "docs/patterns"
pattern_context_builder = "scripts/cascade/patterns.ts"
pattern_context_packs = "docs/patterns/*/*.pack.yaml"
backlog = "docs/backlog"

[harness_evals]
planning_model = "gpt-5.6-sol"
execution_model = "gpt-5.6-terra"
judge_model = "gpt-5.6-sol"
default_model_profile = "execution"
cases = "harness-evals/skill-cases.json"
interactions = "harness-evals/interactions.json"
catalog = "harness-evals/scenarios.generated.json"
response_schema = "harness-evals/response.schema.json"
judge_schema = "harness-evals/judge-response.schema.json"
judge_profiles = "harness-evals/judge-profiles.json"
rubrics = "harness-evals/rubrics"
runner = "scripts/cascade/evals.ts"
artifacts = ".artifacts/harness-evals"

[campaigns]
registry = "product-evals/campaigns"
schema = "product-evals/campaigns/schema.json"
runner = "scripts/cascade/campaigns.ts"
artifacts = ".artifacts/product-evals"
browser_runner = ".codex/harness-tooling/playwright.config.ts"

[product_briefs]
catalog = "docs/product/catalog.yaml"
catalog_schema = "docs/product/catalog.schema.json"
manifest_schema = "docs/specs/brief-manifest.schema.json"
manifests = "docs/specs/*/brief.yaml"
runner = "scripts/cascade/briefs.ts"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 20

[harness_agents]
default_orchestrator = "orchestrator"
onboarding = "project-onboarder"
harness_design = "agent-engineer"
business_analysis = "business-analyst"
security_review = "security"
design_review = "designer"
judged_evaluation = "harness-evaluator"
simulation_execution = "simulation-operator"
simulation_evaluation = "simulation-evaluator"
