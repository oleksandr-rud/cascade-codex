interface:
  display_name: "Design System"
  short_description: "Define reusable UI rules and evidence."
  default_prompt: "Use $design-system to define a reusable token, component, interaction, responsive, accessibility, or visual-evidence rule from grounded reuse evidence. For approved mockups, bind faithful implementation, exact reference/capture conditions and the host render-compare-repair loop."
policy:
  allow_implicit_invocation: true
