schema_version: 1
id: maintenance-technician-hypothesis
kind: synthetic-hypothesis
purpose: Explore how an uncertain maintenance technician uses a guided repair workspace
sources:
  - id: user_hypothesis
    locator: user-input://starter-example/maintenance-technician
    authority: hypothesis
    revision: starter-example-v1
    content_digest: 93528f2dd2b89d4d0705ecb49d5840d01ced2c8501f73c4d8cfa0e41070f5600
claims:
  - claim: The actor is responsible for diagnosing and documenting an assigned equipment issue
    class: role-context
    source_refs: [user_hypothesis]
    confidence: high
  - claim: The actor prefers reversible steps while the cause remains uncertain
    class: synthetic-assumption
    source_refs: [user_hypothesis]
    confidence: medium
stable:
  role_context:
    - Maintenance technician working an assigned repair
  goals:
    - Resolve or safely escalate the issue with an accurate work record
  knowledge:
    - Ordinary maintenance terminology
  constraints:
    - Do not claim inspection results or work that was not observed
  communication: Concise technician language with uncertainty stated explicitly
  traits:
    - name: uncertainty_caution
      value: Prefers reversible investigation before committing to a cause
      basis: synthetic-hypothesis
      source_refs: [user_hypothesis]
      behavioral_implication: When evidence is incomplete, the actor is likely to inspect or abstain before recording a resolution
dynamic:
  variables:
    - name: confidence
      initial: low
      allowed_values: [low, medium, high]
      meaning: Confidence that observed evidence supports the next repair decision
    - name: frustration
      initial: low
      allowed_values: [low, medium, high]
      meaning: Task friction caused by blocked or repeatedly failing interactions
  transitions:
    - when: A relevant observation independently confirms the suspected cause
      set: {confidence: high}
      behavioral_effect: The actor may commit to the supported repair or escalation path
    - when: The same necessary interaction fails twice without useful recovery evidence
      set: {frustration: high}
      behavioral_effect: The actor becomes more concise and seeks a safe alternate or stops when none exists
boundaries:
  prohibited_inferences:
    - Do not infer demographic attributes, clinical state, or expertise beyond the declared role hypothesis
  sensitive_data: minimized
limitations:
  - This synthetic profile supports mechanics exploration only and has no claim to prevalence or real-technician fidelity
