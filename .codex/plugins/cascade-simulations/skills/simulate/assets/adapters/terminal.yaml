schema_version: 2
id: codex-terminal
surface: terminal
driver:
  type: codex-host
  required_capabilities: [terminal.observe, terminal.write]
  bindings:
    terminal.observe: codex-host/write_stdin
    terminal.write: codex-host/write_stdin
  selection: Bind to one persistent Codex terminal session with explicit session identity and bounded polling.
target: replace-with-terminal-session
observations:
  - name: terminal_output
    description: New bounded terminal output and current process or prompt state
    produced_by: [inspect, reconcile, write, cleanup]
actions:
  - name: inspect
    purpose: normal
    description: Read new output from the declared terminal session
    capability: terminal.observe
    risk: read
    confirmation: never
    idempotency: safe-retry
  - name: reconcile
    purpose: recovery
    description: Poll the same terminal session after a recoverable failure
    capability: terminal.observe
    risk: read
    confirmation: never
    idempotency: safe-retry
  - name: write
    purpose: normal
    description: Send characters to the declared terminal session
    capability: terminal.write
    risk: write
    confirmation: when-not-authorized
    idempotency: key-required
    input:
      type: object
      additionalProperties: false
      required: [chars]
      properties:
        chars: {type: string}
  - name: cleanup
    purpose: cleanup
    description: Stop only child processes created and owned by this run
    capability: terminal.write
    risk: write
    confirmation: when-not-authorized
    idempotency: key-required
    input:
      type: object
      additionalProperties: false
      required: [chars]
      properties:
        chars: {type: string, minLength: 1}
errors:
  before_dispatch: Return BLOCKED when the session identity, prompt state, or write authority is unavailable.
  after_dispatch: Return UNKNOWN_OUTCOME when input may have reached the process but the resulting state is unavailable.
recovery:
  description: Poll the same session before considering another write; do not duplicate uncertain input.
  action: reconcile
cleanup:
  required: false
  description: Stop child processes created and owned by this run before finish when any remain.
  action: cleanup
  verification_observation: terminal_output
  verification: Inspect the same session and establish that owned child processes are no longer running.
