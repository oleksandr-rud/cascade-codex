schema_version: 1
plugin:
  name: cascade-specs
  version: "0.1.0+codex.20261002010000"
model_policy:
  model: gpt-6.1-sol
  planning_reasoning_effort: xhigh
  evaluation_reasoning_effort: xhigh
skills:
  - route: cascade-specs:synthesise-spec
    description: Synthesize mixed accepted sources into one proportional feature/change specification or parent-bound task slice with explicit readiness, boundaries and acceptance.
    triggers: [mixed software sources need a coherent specification, a specification requires source conflict or readiness analysis, an implementation slice needs synthesis from an approved parent]
    anti_triggers: [product discovery or approval is the work product, a pure API schema or routine accepted change is sufficient]
    consumes: [source-packet]
    optional_consumes: [product-contract, design-handoff, software-architecture, agent-blueprint]
    produces: [specification-packet]
    required_dependencies: []
    optional_dependencies: [cascade-product:define-product, cascade-design:create-design, cascade-software-architect:architect-software-system, cascade-ai-architect:design-agent-blueprint, cascade-prompt:prompt, cascade-evals:prompt-evaluation]
    policy_tags: [specification, grounded-synthesis]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [parent-bound-slice, conflicting-control, missing-enforcement, source-injection]
