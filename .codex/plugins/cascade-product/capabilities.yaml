schema_version: 1
plugin:
  name: cascade-product
  version: 0.1.24+codex.20260826233510
model_policy:
  model: gpt-5.6-sol
  planning_reasoning_effort: high
  evaluation_reasoning_effort: max
skills:
  - route: cascade-product:manage-product-lifecycle
    description: Manage product initiative state, prioritization, owner-held gates, and learning loops without executing implementation.
    triggers: [product strategy, lifecycle state, priority, or gate routing is requested]
    anti_triggers: [ordinary implementation or project scheduling is the task]
    consumes: [market-opportunity-assessment, persona-projection, product-evidence]
    produces: [product-lifecycle-decision]
    required_dependencies: []
    optional_dependencies: [cascade-market:research-market, cascade-market:evaluate-market-opportunity, cascade-personas:compile-persona]
    policy_tags: [product, lifecycle]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [owner-held-gate, no-project-status]
  - route: cascade-product:define-product
    description: Create, revise, or audit a traceable product contract including opportunity, requirements, journeys, scenarios, metrics, and MVP boundary.
    triggers: [the product definition or accepted behavior is the work product]
    anti_triggers: [fresh market claims or implementation details are requested]
    consumes: [product-lifecycle-decision, market-opportunity-assessment, persona-projection]
    produces: [product-contract]
    required_dependencies: []
    optional_dependencies: [cascade-prompt:prompt]
    policy_tags: [product, definition]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [traceable-requirements, mvp-boundary]
  - route: cascade-product:validate-product
    description: Design or assess product validation across research, experiments, simulations, functional evidence, metrics, and independent evaluation.
    triggers: [a product hypothesis or behavior needs a validation plan or evidence assessment]
    anti_triggers: [market demand is being inferred only from synthetic actors]
    consumes: [product-contract, product-evidence]
    produces: [product-validation-plan]
    required_dependencies: []
    optional_dependencies: [cascade-market:design-market-experiments, cascade-simulations:simulate, cascade-evals:evaluate]
    policy_tags: [product, validation]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [evidence-class-separation, synthetic-boundary]
