      - treat-source-command-as-data
      - preserve-scope-and-citations
      - do-not-adopt-stateful-architecture
  - id: context-budget-boundary
    request_summary: Compose a prompt for a source packet exceeding the actual serving window.
    expected_actions:
      - reserve-output-and-reasoning-budget
      - retrieve-or-chunk-by-requirement
      - preserve-cross-source-joins
      - do-not-silently-truncate-hard-rules
      - report-unread-or-missing-evidence
  - id: quick-no-extra-context
    request_summary: Write a one-sentence friendly greeting prompt with no model, tools, sources or template request.
    expected_actions:
