      - do-not-load-model-adapters
      - do-not-load-context-templates
      - do-not-ask-optional-style-questions
  - id: context-correction
    request_summary: Update the accepted decision in an agent context; old history still states the previous value.
    expected_actions:
      - invalidate-affected-summary-and-reuse
      - preserve-unrelated-decisions
      - do-not-treat-history-as-authority
      - preserve-explicit-permission-boundaries
