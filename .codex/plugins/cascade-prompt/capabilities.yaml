schema_version: 1
plugin:
  name: cascade-prompt
  version: 0.7.14+codex.20261003232324
model_policy:
  model: gpt-6-astra
  planning_reasoning_effort: high
  evaluation_reasoning_effort: high
skills:
  - route: cascade-prompt:prompt
    description: Create, refine, diagnose, compare, convert, or test prompts, context plans, and Laya/Jev/Intern-Decision/Imajev typed questions with model-specific evidence and result semantics.
    triggers: [a prompt, context plan, or typed-decision question set is the requested work product]
    anti_triggers: [the user wants the target task performed instead of a prompt or question set]
    consumes: [prompt-brief, authoritative-sources]
    produces: [prompt-candidate]
    required_dependencies: []
    optional_dependencies: [cascade-evals:prompt-evaluation]
    policy_tags: [prompt-authoring, context-planning]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [complete-contract, missing-input-interview, permission-boundary, sol-tier, astra-adapter, qwen-version-boundary, context-template-boundary]
