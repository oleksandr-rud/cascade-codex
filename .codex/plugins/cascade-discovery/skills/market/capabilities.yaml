schema_version: 1
plugin:
  name: cascade-market
  version: 0.2.10+codex.20261005203443
model_policy:
  model: gpt-6-astra
  planning_reasoning_effort: high
  evaluation_reasoning_effort: high
skills:
  - route: cascade-discovery:research-market
    description: Discover or refresh markets, competitors and alternative workflows using current evidence of jobs, demand, pricing, buying behavior and entrant reachability.
    triggers: [current attributable market evidence is required, open market discovery or comparable niche research is requested, competitor or alternative-solution changes require an evidence refresh]
    anti_triggers: [accepted market evidence already exists and only positioning is requested, only technical implementation or architecture comparison without a market question is requested]
    consumes: [market-research-brief, external-sources]
    produces: [market-evidence-ledger]
    required_dependencies: []
    optional_dependencies: [cascade-discovery:compile-persona, cascade-discovery:evaluate-market-opportunity, cascade-discovery:plan-growth]
    policy_tags: [market-intelligence, research]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [source-attribution, no-synthetic-proof]
  - route: cascade-discovery:evaluate-market-opportunity
    description: Compare markets and entrant opportunities, stress-test differentiation and PMF hypotheses against a frozen evidence ledger.
    triggers: [market opportunity or segment attractiveness needs assessment]
    anti_triggers: [only evidence collection or product approval is requested without an opportunity assessment]
    consumes: [market-evidence-ledger]
    produces: [market-opportunity-assessment]
    required_dependencies: []
    optional_dependencies: [cascade-quality:evaluate, cascade-quality:build-judge, cascade-discovery:brand-positioning, cascade-discovery:define-product, cascade-discovery:plan-growth]
    policy_tags: [market-intelligence, opportunity-assessment]
    effect: READ_ONLY
    authority: READ_ONLY
    evaluation_cases: [uncertainty-preservation, no-score-as-approval]
  - route: cascade-discovery:design-market-experiments
    description: Design or audit real-world market experiments for demand, pricing, channel, positioning, retention, or buying behavior.
    triggers: [a market hypothesis needs a bounded real-participant experiment]
    anti_triggers: [a synthetic simulation is being presented as market proof]
    consumes: [market-evidence-ledger, market-hypothesis]
    optional_consumes: [growth-strategy]
    produces: [market-experiment-plan]
    required_dependencies: []
    optional_dependencies: [cascade-prompt:prompt, cascade-discovery:manage-product-lifecycle, cascade-discovery:plan-growth, cascade-simulations:simulate, cascade-quality:evaluate]
    policy_tags: [market-intelligence, experiment-design]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [kill-criteria, synthetic-evidence-boundary]
  - route: cascade-discovery:brand-positioning
    description: Create or audit positioning, messaging, naming, tone, proof language, trust language, and marketing direction from accepted evidence.
    triggers: [brand positioning or marketing language must be created or revised]
    anti_triggers: [fresh market research or product behavior definition is the real task]
    consumes: []
    consumes_any_of: [product-contract, brand-brief]
    optional_consumes: [market-evidence-ledger, market-opportunity-assessment, persona-projection]
    produces: [marketing-positioning]
    required_dependencies: []
    optional_dependencies: [cascade-discovery:research-market, cascade-discovery:evaluate-market-opportunity, cascade-discovery:plan-growth, cascade-discovery:define-product, cascade-discovery:compile-persona, cascade-design:design-system, cascade-prompt:prompt]
    policy_tags: [market, brand-positioning]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [source-bound-proof, unsupported-claim-hypothesis, product-boundary]
  - route: cascade-discovery:plan-growth
    description: Choose channels and plan growth from acquisition through product value, payment, completion or retention, cohort economics and product feedback.
    triggers: [growth strategy or channel selection is requested, funnel or lifecycle growth needs diagnosis]
    anti_triggers: [copy-only execution of an accepted brief is requested, an individual experiment protocol is the work product]
    consumes: [market-evidence-ledger, market-opportunity-assessment]
    optional_consumes: [product-contract, product-evidence]
    produces: [growth-strategy]
    required_dependencies: []
    optional_dependencies: [cascade-discovery:research-market, cascade-discovery:evaluate-market-opportunity, cascade-discovery:brand-positioning, cascade-discovery:design-market-experiments, cascade-design:design-system, cascade-discovery:define-product, cascade-discovery:validate-product, cascade-discovery:manage-product-lifecycle]
    policy_tags: [market, growth-strategy, value-economics]
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases: [finite-job-growth, unknown-economics-no-scale, growth-product-feedback]
