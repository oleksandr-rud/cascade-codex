schema_version: 1
plugin:
  name: cascade-discovery
  version: 1.0.0+codex.20261006.1
model_policy:
  model: gpt-6-astra
  planning_reasoning_effort: high
  evaluation_reasoning_effort: high
skills:
  - route: cascade-discovery:research-market
    description: Discover or refresh markets, competitors and alternative workflows using current
      evidence of jobs, demand, pricing, buying behavior and entrant reachability.
    triggers:
      - current attributable market evidence is required
      - open market discovery or comparable niche research is requested
      - competitor or alternative-solution changes require an evidence refresh
    anti_triggers:
      - accepted market evidence already exists and only positioning is requested
      - only technical implementation or architecture comparison without a market question is
        requested
    consumes:
      - market-research-brief
      - external-sources
    produces:
      - market-evidence-ledger
    required_dependencies: []
    optional_dependencies:
      - cascade-discovery:compile-persona
      - cascade-discovery:evaluate-market-opportunity
      - cascade-discovery:plan-growth
    policy_tags:
      - market-intelligence
      - research
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - source-attribution
      - no-synthetic-proof
    component: market
    entrypoint: skills/market/skills/research-market/SKILL.md
  - route: cascade-discovery:evaluate-market-opportunity
    description: Compare markets and entrant opportunities, stress-test differentiation and PMF
      hypotheses against a frozen evidence ledger.
    triggers:
      - market opportunity or segment attractiveness needs assessment
    anti_triggers:
      - only evidence collection or product approval is requested without an opportunity assessment
    consumes:
      - market-evidence-ledger
    produces:
      - market-opportunity-assessment
    required_dependencies: []
    optional_dependencies:
      - cascade-quality:evaluate
      - cascade-quality:build-judge
      - cascade-discovery:brand-positioning
      - cascade-discovery:define-product
      - cascade-discovery:plan-growth
    policy_tags:
      - market-intelligence
      - opportunity-assessment
    effect: READ_ONLY
    authority: READ_ONLY
    evaluation_cases:
      - uncertainty-preservation
      - no-score-as-approval
    component: market
    entrypoint: skills/market/skills/evaluate-market-opportunity/SKILL.md
  - route: cascade-discovery:design-market-experiments
    description: Design or audit real-world market experiments for demand, pricing, channel,
      positioning, retention, or buying behavior.
    triggers:
      - a market hypothesis needs a bounded real-participant experiment
    anti_triggers:
      - a synthetic simulation is being presented as market proof
    consumes:
      - market-evidence-ledger
      - market-hypothesis
    optional_consumes:
      - growth-strategy
    produces:
      - market-experiment-plan
    required_dependencies: []
    optional_dependencies:
      - cascade-prompt:prompt
      - cascade-discovery:manage-product-lifecycle
      - cascade-discovery:plan-growth
      - cascade-simulations:simulate
      - cascade-quality:evaluate
    policy_tags:
      - market-intelligence
      - experiment-design
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - kill-criteria
      - synthetic-evidence-boundary
    component: market
    entrypoint: skills/market/skills/design-market-experiments/SKILL.md
  - route: cascade-discovery:brand-positioning
    description: Create or audit positioning, messaging, naming, tone, proof language, trust language,
      and marketing direction from accepted evidence.
    triggers:
      - brand positioning or marketing language must be created or revised
    anti_triggers:
      - fresh market research or product behavior definition is the real task
    consumes: []
    consumes_any_of:
      - product-contract
      - brand-brief
    optional_consumes:
      - market-evidence-ledger
      - market-opportunity-assessment
      - persona-projection
    produces:
      - marketing-positioning
    required_dependencies: []
    optional_dependencies:
      - cascade-discovery:research-market
      - cascade-discovery:evaluate-market-opportunity
      - cascade-discovery:plan-growth
      - cascade-discovery:define-product
      - cascade-discovery:compile-persona
      - cascade-design:design-system
      - cascade-prompt:prompt
    policy_tags:
      - market
      - brand-positioning
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - source-bound-proof
      - unsupported-claim-hypothesis
      - product-boundary
    component: market
    entrypoint: skills/market/skills/brand-positioning/SKILL.md
  - route: cascade-discovery:plan-growth
    description: Choose channels and plan growth from acquisition through product value, payment,
      completion or retention, cohort economics and product feedback.
    triggers:
      - growth strategy or channel selection is requested
      - funnel or lifecycle growth needs diagnosis
    anti_triggers:
      - copy-only execution of an accepted brief is requested
      - an individual experiment protocol is the work product
    consumes:
      - market-evidence-ledger
      - market-opportunity-assessment
    optional_consumes:
      - product-contract
      - product-evidence
    produces:
      - growth-strategy
    required_dependencies: []
    optional_dependencies:
      - cascade-discovery:research-market
      - cascade-discovery:evaluate-market-opportunity
      - cascade-discovery:brand-positioning
      - cascade-discovery:design-market-experiments
      - cascade-design:design-system
      - cascade-discovery:define-product
      - cascade-discovery:validate-product
      - cascade-discovery:manage-product-lifecycle
    policy_tags:
      - market
      - growth-strategy
      - value-economics
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - finite-job-growth
      - unknown-economics-no-scale
      - growth-product-feedback
    component: market
    entrypoint: skills/market/skills/plan-growth/SKILL.md
  - route: cascade-discovery:manage-product-lifecycle
    description: Manage value strategy, portfolio allocation, product priorities, owner-held gates and
      evidence-driven re-entry without implementation.
    triggers:
      - product strategy or investment allocation is requested
      - product lifecycle or evidence-driven gate routing is requested
      - observed outcomes or changed market evidence may invalidate a prior product decision
    anti_triggers:
      - only implementation of accepted product decisions or project scheduling is needed
    consumes:
      - product-evidence
    optional_consumes:
      - market-opportunity-assessment
      - persona-projection
      - growth-strategy
    produces:
      - product-lifecycle-decision
    required_dependencies: []
    optional_dependencies:
      - cascade-discovery:research-market
      - cascade-discovery:evaluate-market-opportunity
      - cascade-discovery:plan-growth
      - cascade-discovery:compile-persona
      - cascade-workflows:plan-project
    policy_tags:
      - product
      - lifecycle
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - owner-held-gate
      - no-project-status
    component: product
    entrypoint: skills/product/skills/manage-product-lifecycle/SKILL.md
  - route: cascade-discovery:define-product
    description: Turn supplied problems, opportunities and learning into value or offer models, idea and
      feature candidates, traceable requirements, acceptance behavior and the MVP.
    triggers:
      - a product value or offer model needs definition
      - ideas or features must be generated or compared from supplied inputs
      - the product definition or accepted behavior is the work product
      - a redesign or feature retirement changes intended user behavior
    anti_triggers:
      - only external market evidence collection is requested
      - implementation of an already specified change is the task
      - only internal refactoring with unchanged accepted product behavior is requested
    consumes:
      - product-evidence
    optional_consumes:
      - product-lifecycle-decision
      - market-opportunity-assessment
      - persona-projection
      - growth-strategy
    produces:
      - product-contract
    required_dependencies: []
    optional_dependencies:
      - cascade-prompt:prompt
      - cascade-discovery:plan-growth
      - cascade-design:ux-flow-review
      - cascade-design:design-system
      - cascade-ai-architect:design-agent-blueprint
    policy_tags:
      - product
      - definition
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - traceable-requirements
      - mvp-boundary
      - feature-value-handoff
      - finite-job-offer
    component: product
    entrypoint: skills/product/skills/define-product/SKILL.md
  - route: cascade-discovery:validate-product
    description: Design or assess product validation, outcome measures, sustained progress, transfer and
      causal evidence alongside functional and independent evaluation.
    triggers:
      - a product hypothesis or behavior needs a validation plan or evidence assessment
    anti_triggers:
      - market demand is being inferred only from synthetic actors
    consumes:
      - product-contract
      - product-evidence
    produces:
      - product-validation-plan
    required_dependencies: []
    optional_dependencies:
      - cascade-discovery:design-market-experiments
      - cascade-simulations:simulate
      - cascade-quality:evaluate
    policy_tags:
      - product
      - validation
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - evidence-class-separation
      - synthetic-boundary
      - progress-is-not-transfer
    component: product
    entrypoint: skills/product/skills/validate-product/SKILL.md
  - route: cascade-discovery:build-persona
    description: Create or revise a canonical source-grounded Persona with provenance, stable traits,
      dynamic state, uncertainty, and privacy controls.
    triggers:
      - canonical persona truth or behavior rules must change
    anti_triggers:
      - only a consumer projection or runtime actor is required
    consumes:
      - persona-evidence
      - persona-brief
    produces:
      - canonical-persona
    required_dependencies: []
    optional_dependencies:
      - cascade-prompt:prompt
    policy_tags:
      - personas
      - canonical-model
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - provenance
      - synthetic-honesty
      - privacy
    component: personas
    entrypoint: skills/personas/skills/build-persona/SKILL.md
  - route: cascade-discovery:compile-persona
    description: Compile a frozen canonical Persona into a digest-bound purpose-limited consumer projection.
    triggers:
      - a product, market, architecture, evaluation, or simulation persona projection is required
    anti_triggers:
      - canonical persona facts must be created or revised
    consumes:
      - canonical-persona
    produces:
      - persona-projection
    required_dependencies: []
    optional_dependencies: []
    policy_tags:
      - personas
      - projection
    effect: CANDIDATE_WRITE
    authority: READ_ONLY
    evaluation_cases:
      - purpose-limitation
      - digest-binding
    component: personas
    entrypoint: skills/personas/skills/compile-persona/SKILL.md
  - route: cascade-discovery:evaluate-persona
    description: Independently audit a frozen Persona or projection for grounding, coherence, privacy,
      bias risk, and consumer compatibility.
    triggers:
      - a persona or projection needs independent evaluation
    anti_triggers:
      - only persona creation, revision, or runtime simulation is requested
    consumes: []
    consumes_any_of:
      - canonical-persona
      - persona-projection
    produces:
      - persona-evaluation
    required_dependencies: []
    optional_dependencies:
      - cascade-quality:evaluate
      - cascade-quality:build-judge
    policy_tags:
      - personas
      - evaluation
    effect: READ_ONLY
    authority: READ_ONLY
    evaluation_cases:
      - builder-cannot-self-accept
      - consumer-compatibility
    component: personas
    entrypoint: skills/personas/skills/evaluate-persona/SKILL.md
