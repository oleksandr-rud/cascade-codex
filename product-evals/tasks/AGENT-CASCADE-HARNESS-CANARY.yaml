    filesystem: read-only
    network: deny
    tools: []
  prompt_file: product-evals/tasks/agent-response/cascade-harness-prompt.md
  runtime:
    model: gpt-5.6-sol
    provider: codex
    reasoning_effort: max
  source_blind: true
  target:
    mode: cascade-profile
    profile_file: product-evals/tasks/agent-response/cascade-harness-profile-v1.yaml
driver:
  adapter: builtin-agent-cascade
  type: agent-runtime
id: AGENT-CASCADE-HARNESS-CANARY
inputs:
  - product-evals/tasks/agent-response/cascade-harness-profile-v1.yaml
  - product-evals/tasks/agent-response/cascade-harness-prompt.md
  - product-evals/tasks/agent-response/cascade-harness-scenario.yaml
  - harness-evals/response.schema.json
kind: agent-response
oracle_ids:
  - agent-response-contract-valid-v1
policy_ids:
  - allow-agent-cascade-harness-v1
required: true
schema_version: 5
timeout_ms: 180000
