command:
  - /usr/bin/printf
  - cascade-static-ok
driver:
  adapter: builtin-direct-process
  type: direct-process
id: HARNESS-STATIC-SMOKE
kind: command
oracle_ids:
  - command-exit-zero-v1
policy_ids:
  - allow-harness-static-command-v1
process:
  environment: {}
  filesystem:
    read: host
    write: task-root
  interactive: false
  network: deny
  working_directory: task-root
required: true
schema_version: 3
timeout_ms: 1000
