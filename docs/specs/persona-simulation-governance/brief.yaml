evidence:
  - id: EVD-001
    kind: peer-reviewed-research
    authority: methodological
    title: Evaluating Large Language Models as Generative User Simulators for Conversational Recommendation
    url: https://aclanthology.org/2024.naacl-long.83/
    reference_date: 2024-06-01
    supports: [PSG-002, PSG-003, PCB-003]
    limitations: Domain-specific simulator evaluation does not establish a Cascade target persona or universal behavioral validity.
    status: reviewed
  - id: EVD-002
    kind: peer-reviewed-research
    authority: methodological
    title: SimulatorArena - Are User Simulators Reliable Proxies for Multi-Turn Evaluation of AI Assistants?
    url: https://aclanthology.org/2025.emnlp-main.1786/
    reference_date: 2025-11-01
    supports: [PSG-001, PSG-002, PCB-003]
    limitations: Task-specific alignment against annotated conversations does not authorize uncalibrated reuse in another product domain.
    status: reviewed
  - id: EVD-003
    kind: primary-research
    authority: methodological
    title: Generative Agent Simulations of 1,000 People
    url: https://arxiv.org/abs/2411.10109
    reference_date: 2024-11-15
    supports: [PSG-001, PSG-003, PCB-003]
    limitations: Interview-grounded survey and experiment replication is not a substitute for target-product research or persona review.
    status: reviewed
  - id: EVD-004
    kind: primary-research
    authority: methodological
    title: Lost in Simulation - LLM-Simulated Users are Unreliable Proxies for Human Users in Agentic Evaluations
    url: https://arxiv.org/abs/2601.17087
    reference_date: 2026-01-23
    supports: [PSG-003, PSG-004, PCB-003]
    limitations: One benchmark identifies robustness, calibration, and fairness risks but does not quantify every target domain.
    status: reviewed
