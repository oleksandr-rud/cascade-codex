schema_id: architecture-default-graph-v1
graph_id: backend-infrastructure
pair_kind: extension
title: Backend Infrastructure
status: reference-default
spec_path: docs/patterns/architecture-defaults/backend-infrastructure.spec.md
extends:
  - infrastructure
requires:
  - service-api-worker
  - backend-stack
preserves:
  - "infrastructure:scope-before-provider"
  - "infrastructure:resource-ownership"
  - "infrastructure:least-privilege-and-isolation"
  - "infrastructure:cost-and-lifecycle"
  - "infrastructure:failure-and-recovery-proof"
  - "infrastructure:application-profile-routing"
  - "infrastructure:shared-resource-contract"
  - "infrastructure:client-resource-boundary"
  - "infrastructure:tenant-isolation-enforcement"
  - "infrastructure:workload-identity-lifecycle"
  - "infrastructure:telemetry-data-boundary"
compatible_with:
  - infrastructure-compute
  - infrastructure-data
  - infrastructure-messaging
  - infrastructure-delivery
  - caching-strategy
  - event-driven
  - tenancy-strategy
default_when:
  - "A backend-service or backend-worker unit needs API, BFF, worker, consumer, scheduler, or batch infrastructure."
  - "Backend application units share database, cache, object/search, messaging, or delivery resources whose ownership and consumers must be explicit."
do_not_use_when:
  - "The unit is only a web frontend, native app, CLI, or experiment with no separately owned backend-service or backend-worker boundary."
  - "The task selects an application runtime, framework, library, event meaning, cache policy, or provider product rather than backend resource topology."
nodes:
  - id: backend-application-units
    kind: application-scope
    owns: "Backend-service and backend-worker units, deployment scopes, release boundaries, and consuming relationships."
  - id: api-bff-runtime-roles
    kind: workload-role-set
    owns: "API and separate BFF ingress, concurrency, timeout, workload identity, scaling, health, drain, and shutdown requirements."
  - id: worker-consumer-runtime-roles
    kind: workload-role-set
    owns: "Worker and consumer delivery contract, concurrency, backpressure, downstream capacity, drain, resume, cancellation, and shutdown requirements."
  - id: scheduler-batch-runtime-roles
    kind: workload-role-set
    owns: "Scheduler and batch trigger, overlap, checkpoint, quota, capacity, cancellation, retry, artifact, and completion requirements."
  - id: module-semantics
    kind: preserved-application-boundary
    owns: "Module workflows, domain data authority, event and job meaning, schemas, use cases, and module-specific ports and adapters."
  - id: shared-technical-mechanics
    kind: preserved-technical-boundary
    owns: "Reusable src/libs connection, transaction, cache-client, broker-client, codec, retry, telemetry, and lifecycle mechanics without product semantics."
  - id: compute-resource-route
    kind: extension-router
    owns: "API, BFF, worker, consumer, scheduler, and batch compute placement, scaling, workload identity, and lifecycle routing."
  - id: database-resource-route
    kind: extension-router
    owns: "Authoritative database access, consistency, migration, retention, backup, restore, residency, capacity, and failure routing."
  - id: cache-resource-route
    kind: extension-router
    owns: "Deployed cache identity, network, capacity, persistence, recovery, cost, and failure routing after cache policy is resolved."
  - id: object-search-resource-route
    kind: extension-router
    owns: "Object/blob, search, and derived-data capacity, indexing, lifecycle, recovery, residency, and failure routing."
  - id: queue-resource-route
    kind: extension-router
    owns: "Work distribution, lease or visibility, acknowledgement, retry, dead-letter, quota, and poison-isolation resource routing."
  - id: pubsub-resource-route
    kind: extension-router
    owns: "Fan-out, subscription isolation, retention, authorization, schema-compatibility, and slow-consumer resource routing."
  - id: stream-resource-route
    kind: extension-router
    owns: "Partitioning, ordering scope, offsets, retention, replay, compaction, authorization, and capacity resource routing."
  - id: scheduler-resource-route
    kind: extension-router
    owns: "Time or deferred dispatch, timezone, missed-run, overlap, idempotency, retry, and ownership resource routing."
  - id: delivery-operations-route
    kind: extension-router
    owns: "Network, edge, artifacts, CI/CD, configuration, secrets, observability, infrastructure code, release, and rollback routing."
  - id: resource-ownership-register
    kind: ownership-contract
    owns: "Exactly one owner plus every application-unit consumer, scope, isolation, lifecycle, budget, alert route, recovery objective, and teardown route for each resource."
  - id: tenant-isolation-contract
    kind: security-boundary
    owns: "Resolved tenancy-strategy, authenticated tenant derivation, fail-closed missing or mismatch handling, and tenant-aware database, cache, object/search, message, replay, and restore isolation."
  - id: messaging-action-authorization
    kind: security-policy
    owns: "Deny-by-default role, tenant, resource, and action authorization for publish, consume, acknowledge, subscribe, trigger, dead-letter, replay, and administrative messaging operations."
  - id: workload-identity-contract
    kind: security-boundary
    owns: "Managed short-lived audience, resource, role, and tenant-scoped workload identity, rotation, emergency revocation, and stale credential rejection without shared exported credentials."
  - id: telemetry-privacy-contract
    kind: privacy-boundary
    owns: "Backend telemetry allowlists, pre-export sensitive-data exclusion and redaction, tenant/access separation, retention, deletion, sampling, and synthetic canary leak detection."
  - id: cross-resource-consistency
    kind: reliability-contract
    owns: "Database-outbox publication, inbox/idempotency, committed-write cache invalidation, migration ordering, and reconciliation obligations."
  - id: cross-resource-failure
    kind: reliability-contract
    owns: "Partial outage, dependency saturation, retry, dead-letter, replay, cache fallback, backpressure, restore, resume, rollback, and operator recovery rules."
  - id: backend-infrastructure-proof
    kind: evidence
    owns: "Role, ownership, consumer, isolation, capacity, consistency, migration, failure, recovery, cost, and teardown evidence without provider selection."
