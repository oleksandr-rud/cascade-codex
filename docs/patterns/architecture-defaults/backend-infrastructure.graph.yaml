decisions:
  - id: one-profile-explicit-runtime-roles
    default: "Use one backend infrastructure profile for backend-service and backend-worker units, then classify API, separate BFF, worker, consumer, scheduler, and batch roles explicitly."
    exception_when: "An independently owned unit has a materially different deployment, security, data, or lifecycle boundary; keep the same profile contract and record a separate scope."
  - id: bff-is-a-backend-boundary
    default: "Treat a BFF with domain workflows, durable data, independent contracts, multiple clients, messaging, scaling, or release ownership as a separate backend-service that calls owned application interfaces."
    exception_when: "A frontend-owned embedded BFF only adapts sessions or UI data and remains inseparable from the frontend build, deployment, owner, and release."
  - id: application-semantics-stay-in-modules
    default: "Keep domain workflows, data authority, event and job meaning, schemas, use cases, and module-specific ports and adapters in application modules; src/libs and infrastructure resources own technical mechanics only."
    exception_when: "An explicitly governed cross-application contract has its own owner, public surface, versioning, and validation."
  - id: route-resources-without-providers
    default: "Route compute, database/cache/object/search, queue/pub-sub/stream/scheduler, and delivery concerns to their existing infrastructure extensions before evaluating provider candidates."
    exception_when: "A binding provider mandate exists; record the coupling and gaps without moving provider selection into this profile."
  - id: one-owner-all-consumers
    default: "Give every shared resource exactly one owner and enumerate every consuming application unit, identity, permission, isolation, capacity, lifecycle, budget, alert, recovery, and teardown contract."
    exception_when: "A resource is disposable inside one bounded run and is created and destroyed by that run's sole owner."
  - id: multitenant-scope-requires-tenancy-strategy
    default: "Before selecting any resource for a multi-tenant scope, resolve tenancy-strategy, derive tenant context from authenticated server-side identity, deny missing or mismatched context, and enforce tenant isolation across database, cache, messages, replay, restore, operations, and telemetry."
    exception_when: "The deployment and every resource are proven single-tenant; record the invariant and block runtime tenant multiplexing."
  - id: deny-by-default-messaging-actions
    default: "Deny every messaging action unless the authenticated workload role is explicitly allowed to publish, consume, acknowledge, subscribe, trigger, inspect or move dead-letter work, replay, or administer the named resource for the resolved tenant."
    exception_when: "None; local disposable substitutes may simplify identity issuance but preserve the same deny-by-default action contract."
  - id: managed-short-lived-workload-identity
    default: "Use managed short-lived credentials scoped to audience, resource, workload role, and tenant where applicable; reject expired, stale, revoked, wrong-audience, wrong-resource, or wrong-role credentials and never share exported credentials between workloads."
    exception_when: "A bounded local-only substitute has no external data or credentials; production-equivalent authorization behavior remains required."
  - id: telemetry-data-minimization
    default: "Export only allowlisted backend telemetry fields after local exclusion or redaction of sensitive payloads, secrets, credentials, and tenant identifiers, with tenant/access separation, retention, deletion, sampling, and canary leak tests."
    exception_when: "A specifically approved diagnostic capture has a bounded owner, access policy, purpose, expiry, deletion proof, and no credential material."
  - id: authoritative-database-contract
    default: "Give transactional domain data one authoritative owner and prove access patterns, consistency, migrations, retention, backup, executed restore, residency, deletion, capacity, and exit."
    exception_when: "Data is explicitly disposable and reproducible from owned inputs, with lifecycle and deletion evidence."
  - id: cache-policy-before-resource
    default: "Block cache resource selection until caching-strategy defines eligibility, keys, freshness, invalidation, isolation, stampede control, source fallback, and removal criteria."
    exception_when: "The selected data system is intentionally authoritative rather than a cache and has durability, consistency, and recovery contracts."
  - id: messaging-model-from-semantics
    default: "Use a queue for one-consumer work distribution, pub/sub for isolated fan-out, a stream/log for ordered retained replayable facts, and a scheduler for time or deferred dispatch."
    exception_when: "An established messaging resource is mandated; map required semantics, missing guarantees, and operational adaptations explicitly."
  - id: at-least-once-consumer-contract
    default: "Assume duplicate delivery and require inbox/idempotency, bounded retry and backoff, poison isolation, dead letter, backpressure, graceful drain, resume, and downstream-capacity proof."
    exception_when: "A stronger end-to-end delivery guarantee, including all side effects, is demonstrated for the exact path."
  - id: outbox-inbox-consistency
    default: "Use transactional outbox or equivalent atomic publication when state and a message must not diverge, and keep inbox/idempotency with the consuming application effect."
    exception_when: "Loss or duplication is an accepted documented outcome, or an equivalent atomic end-to-end mechanism is proven."
  - id: committed-write-invalidation
    default: "Invalidate, version, or refresh derived cache entries only after the authoritative owner write commits; cache failure must not change write success."
    exception_when: "A documented write-through correctness contract atomically includes both authoritative and cache writes."
  - id: consumer-scaling-follows-capacity
    default: "Scale consumers from lag and saturation within downstream database, cache, provider, partition, quota, and connection limits, with explicit minimum, maximum, drain, and overload behavior."
    exception_when: "A fixed bounded schedule and proven workload envelope make autoscaling unnecessary."
  - id: migration-backup-restore-order
    default: "Sequence schema and resource migrations with compatible application releases, independent backup evidence, executed restore proof, rollback or forward recovery, and consumer replay compatibility."
    exception_when: "The resource is disposable, reproducible, and isolated from durable or externally visible state."
  - id: cross-resource-failure-is-explicit
    default: "Define behavior for each resource outage and partial success: cache fallback, database write rejection, publish reconciliation, consumer backpressure, retry/dead-letter, replay, scheduler overlap, restore, resume, and operator escalation."
    exception_when: "A bounded best-effort path documents acceptable loss, no replay, and its user-visible impact."
validation:
  - "The graph and spec identify backend-infrastructure, cross-link each other, and use only architecture-default-graph-v1 fields."
  - "Every edge resolves to a node in this graph and the extends/requires dependency remains acyclic."
  - "Every API, BFF, worker, consumer, scheduler, and batch role maps to owned compute, data, messaging, and delivery requirements without duplicating provider catalogs."
  - "Every shared resource has exactly one owner and enumerates all consumers, identities, permissions, isolation, capacity, lifecycle, budget, alerts, recovery, and teardown."
  - "Every multi-tenant scope resolves tenancy-strategy, derives tenant context from authenticated server-side identity, denies missing or mismatched context, and proves database, cache, object path/container/key, search index/query/projection, message, replay, restore, operations, and telemetry isolation with negative cases."
  - "Publish, consume, acknowledge, subscribe, trigger, dead-letter, replay, and messaging administration are deny-by-default and explicitly authorized per workload role, tenant, resource, and action."
  - "Workload credentials are managed, short-lived, audience/resource/role scoped, rotated, emergency-revocable, rejected when stale or mismatched, and never shared as exported credentials."
  - "Backend telemetry uses field allowlists, pre-export sensitive-data exclusion/redaction, tenant/access separation, retention, deletion, sampling, and synthetic canary leak tests."
  - "Database, cache, object/search, queue, pub/sub, stream, scheduler, secrets, observability, and delivery concerns route to the existing resource extensions."
  - "Cache eligibility, keys, freshness, invalidation, isolation, stampede, and fallback remain owned by caching-strategy."
  - "Event and job meaning, schemas, outbox, inbox/idempotency, subscribers, and module boundaries remain owned by event-driven and service-api-worker."
  - "API-owned transactional data proves migration, recovery, residency, and ownership; backup configuration and executed restore remain separate evidence."
  - "At-least-once consumers prove idempotency, retry, poison isolation, shutdown, resume, backpressure, and downstream capacity."
  - "Pub/sub proves subscription isolation and schema/authorization policy; stream/log proves partitioning, ordering, retention, offsets, replay, and compaction."
  - "Cross-resource tests cover partial writes, publication gaps, invalidation failure, dependency outage, saturation, dead letter, replay, migration, backup/restore, rollback, and operator recovery."
  - "No provider product, infrastructure-as-code template, application package, or new scaffold path is selected by this profile."
