schema_id: architecture-default-graph-v1
graph_id: experiment-stack
pair_kind: extension
title: Experiment Stack
status: reference-default
spec_path: docs/patterns/architecture-defaults/experiment-stack.spec.md
extends:
  - app-stack
requires:
  - experiment
preserves:
  - "app-stack:claims-drive-eligibility"
  - "app-stack:policy-filter-before-score"
  - "app-stack:application-type-branch"
  - "app-stack:architecture-before-package"
  - "app-stack:existing-stack-first"
  - "app-stack:proof-before-adoption"
compatible_with:
  - infrastructure
default_when:
  - "An experiment needs a reproducible language, environment, notebook/script, acceleration, and artifact profile."
do_not_use_when:
  - "The artifact is already a production service, client, or CLI."
nodes:
  - id: experiment-unit
    kind: application-scope
    owns: "One bounded experiment and its question, inputs, computation, and promotion constraints."
  - id: script-profile
    kind: candidate-family
    owns: "Versioned source-first execution suitable for automation and review."
  - id: notebook-profile
    kind: candidate-family
    owns: "Interactive exploration with explicit conversion or execution discipline."
  - id: accelerated-profile
    kind: candidate-family
    owns: "Hardware- or provider-accelerated computation with environment and artifact controls."
  - id: experiment-proof
    kind: evidence
    owns: "Environment lock, deterministic inputs, artifact lineage, rerun, cost, and promotion evidence."
edges:
  - from: experiment-unit
    to: script-profile
    relation: may_select
  - from: experiment-unit
    to: notebook-profile
    relation: may_select
  - from: experiment-unit
    to: accelerated-profile
    relation: may_select
  - from: script-profile
    to: experiment-proof
    relation: validated_by
  - from: notebook-profile
    to: experiment-proof
    relation: validated_by
  - from: accelerated-profile
    to: experiment-proof
    relation: validated_by
decisions:
  - id: ecosystem-before-preference
    default: "Choose the language and environment from required libraries, data formats, acceleration, reproducibility, and team review capability."
    exception_when: "The experiment is intentionally testing the technology itself."
  - id: source-before-notebook-state
    default: "Keep reusable computation in versioned modules and treat notebooks as orchestration, exploration, and presentation."
    exception_when: "The artifact is disposable exploration with no reuse or promotion path."
  - id: promotion-is-new-decision
    default: "Production promotion triggers a fresh application technology and infrastructure decision."
    exception_when: "The experiment already used the production profile and passed its full gates."
validation:
  - "The unit is experiment."
  - "Environment lock, input identity, deterministic rerun, artifact lineage, cost, and cleanup are proved."
  - "Promotion does not inherit experimental shortcuts as production defaults."
