schema_id: architecture-default-graph-v1
graph_id: library-infrastructure
pair_kind: extension
title: Library Infrastructure
status: reference-default
spec_path: docs/patterns/architecture-defaults/library-infrastructure.spec.md
extends:
  - infrastructure
requires:
  - sdk-library
  - library-stack
preserves:
  - "infrastructure:scope-before-provider"
  - "infrastructure:existing-platform-first"
  - "infrastructure:managed-before-self-managed"
  - "infrastructure:single-platform-default"
  - "infrastructure:resource-ownership"
  - "infrastructure:environment-contract"
  - "infrastructure:least-privilege-and-isolation"
  - "infrastructure:cost-and-lifecycle"
  - "infrastructure:failure-and-recovery-proof"
  - "infrastructure:infrastructure-as-code-authority"
  - "infrastructure:application-profile-routing"
  - "infrastructure:fullstack-is-composition"
  - "infrastructure:shared-resource-contract"
  - "infrastructure:client-resource-boundary"
  - "infrastructure:tenant-isolation-enforcement"
  - "infrastructure:workload-identity-lifecycle"
  - "infrastructure:telemetry-data-boundary"
compatible_with:
  - infrastructure-compute
  - infrastructure-delivery
default_when:
  - "A library has evidence-backed build, registry, artifact, signing, provenance, documentation, release, or browser-bundle resource needs."
  - "A package distribution profile must be separated from the hosted APIs or services it consumes."
do_not_use_when:
  - "The library has no operated build or distribution resource; retain the explicit no-production-runtime result."
  - "The concern is a hosted API, database, cache, queue, stream, pub/sub, telemetry receiver, developer control plane, or other operated service."
nodes:
  - id: library-infrastructure-scope
    kind: application-resource-scope
    owns: "One library release scope, supported consumers and targets, owners, channels, and evidence-linked infrastructure needs."
  - id: no-production-runtime
    kind: negative-selection
    owns: "Default result that a distributed package runs inside consumers and owns no production service runtime."
  - id: build-compute
    kind: optional-compute
    owns: "Evidence-backed clean, isolated, reproducible, multi-target, generator, documentation, and browser-bundle build execution."
  - id: package-registry
    kind: delivery-resource
    owns: "Evidence-backed package publication, identity, namespace, access, integrity, retention, yanking, deprecation, and recovery."
  - id: artifact-storage
    kind: delivery-resource
    owns: "Identified source, package, binary, symbol, documentation, manifest, and compatibility artifacts plus retention and deletion."
  - id: signing-boundary
    kind: trust-boundary
    owns: "Build and release workload identity, signing keys or attestations, verification, rotation, revocation, audit, and recovery."
  - id: provenance-records
    kind: supply-chain-evidence
    owns: "Source, dependency, toolchain, generator, build, test, artifact digest, signature, publication, and channel lineage."
  - id: documentation-delivery
    kind: delivery-resource
    owns: "Version-mapped static documentation and examples, redirects, retention, security headers, and rollback."
  - id: release-channels
    kind: delivery-resource
    owns: "Promotion, verification, staged availability, compatibility, rollback, yanking, deprecation, and retirement."
  - id: browser-bundle-artifacts
    kind: delivery-resource
    owns: "Optional ESM, WASM, source-map, type, worker, or other browser-consumable artifacts and their integrity, size, compatibility, and sensitive-content checks."
  - id: hosted-service-boundary
    kind: ownership-boundary
    owns: "Separately selected hosted APIs, data, caches, messaging, telemetry receivers, portals, and control planes without transferring ownership to the package."
  - id: library-infrastructure-proof
    kind: evidence
    owns: "No-runtime, build, artifact, signing, provenance, registry, documentation, browser-bundle, release, failure, recovery, cost, and hosted-ownership validation."
edges:
  - from: library-infrastructure-scope
    to: no-production-runtime
    relation: defaults_to
  - from: library-infrastructure-scope
    to: build-compute
    relation: includes_when_evidenced
  - from: build-compute
    to: artifact-storage
    relation: produces
  - from: build-compute
    to: browser-bundle-artifacts
    relation: may_produce
  - from: artifact-storage
    to: signing-boundary
    relation: verified_by
  - from: browser-bundle-artifacts
    to: signing-boundary
    relation: verified_by
  - from: signing-boundary
    to: provenance-records
    relation: recorded_in
  - from: provenance-records
    to: package-registry
    relation: published_with
  - from: provenance-records
    to: documentation-delivery
    relation: published_with
  - from: package-registry
    to: release-channels
    relation: supplies
  - from: documentation-delivery
    to: release-channels
    relation: versioned_with
  - from: browser-bundle-artifacts
    to: release-channels
    relation: distributed_through
  - from: library-infrastructure-scope
    to: hosted-service-boundary
    relation: separates
  - from: no-production-runtime
    to: library-infrastructure-proof
    relation: validated_by
  - from: release-channels
    to: library-infrastructure-proof
    relation: validated_by
  - from: hosted-service-boundary
    to: library-infrastructure-proof
