decisions:
  - id: no-production-runtime-default
    default: "A library owns no production service runtime; add only evidence-backed build and distribution resources because its executable behavior runs inside consumers."
    exception_when: "There is no hosted-runtime exception inside this profile; classify project-owned hosted behavior as a separate backend application unit."
  - id: build-compute-from-evidence
    default: "Select compute only for proved build, generation, testing, documentation, signing, or multi-target artifact work with approved dependency sources, integrity-verified resolution, private namespace protection, reviewed lock drift, isolated install hooks, and bounded egress that cannot remain in an existing pipeline."
    exception_when: "An existing owned pipeline supplies the same isolated, reproducible, least-privilege, cost, and recovery contract."
  - id: distribution-through-delivery
    default: "Route registries, artifacts, documentation, release channels, secrets, observability, promotion, and rollback through infrastructure-delivery."
    exception_when: "A true external package authority owns the resource; record it as an external dependency and verify its trust and recovery contract."
  - id: signing-identity-lifecycle
    default: "Use managed short-lived, role- and resource-scoped release identity where possible; isolate signing authority and prove rotation, emergency revocation, stale-credential rejection, and audit."
    exception_when: "A platform requires a static signing key; isolate it, minimize access, rotate it, audit use, and record the platform limit and recovery path."
  - id: provenance-and-reproducibility
    default: "Link every released artifact to source, dependencies, toolchain, generator inputs, build, tests, digest, signature or attestation, publication, and channel evidence."
    exception_when: "A build cannot be bit-for-bit reproducible; record normalized equivalence, environmental variance, and independent artifact verification."
  - id: browser-bundle-is-artifact
    default: "Treat browser bundles, WASM, types, workers, and source maps as versioned delivery artifacts; they do not grant server runtime, secret, data, cache, or messaging ownership."
    exception_when: "Browser execution is part of a separately selected web-frontend unit; its runtime and delivery needs resolve through frontend-infrastructure."
  - id: hosted-services-are-backend
    default: "A project-owned hosted API, telemetry receiver, documentation control plane, developer portal, or update service is a separate backend application unit."
    exception_when: "A static documentation artifact remains delivery-only; a true external hosted service is recorded as an external dependency."
  - id: no-data-or-messaging-ownership
    default: "Library infrastructure never selects production databases, cache services, object/search domain stores, queues, pub/sub, or streams for the package."
    exception_when: "Build artifacts and release metadata remain delivery resources; any operated data or messaging capability belongs to a separately classified backend unit."
validation:
  - "SL-004: a package needing registry publication and documentation selects only justified compute and delivery resources and no production runtime, data, cache, or messaging."
  - "A build-labeled compute resource with a production-service lifecycle is rejected; library compute uses a bounded typed lifecycle and explicit teardown."
  - "SL-005: an SDK consuming a hosted API keeps client and artifact concerns here while a separate backend unit owns the API and operated resources."
  - "Every build, registry, artifact, signing, provenance, documentation, release, and browser-bundle resource is evidence-backed or explicitly absent."
  - "Release jobs prove least privilege, short-lived identity where supported, secret isolation, signature verification, rotation, emergency revocation, stale-credential rejection, and privileged audit."
  - "Artifacts and telemetry prove allowlisted contents, secret and tenant-data exclusion, retention, deletion, cost, failure, rollback, and compromised-release recovery."
  - "Dependency-confusion and typosquatting probes prove trusted registry/source mapping, private namespace reservation, integrity, lock/resolution review, install-hook isolation, and bounded build egress before signing."
  - "Reject any library profile that invents production compute, database, cache, queue, pub/sub, stream, or hosted control-plane ownership."
