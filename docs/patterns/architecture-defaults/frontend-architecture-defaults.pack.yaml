pack_id: frontend-architecture-defaults
entry_id: architecture-defaults
title: Frontend Architecture Defaults
kind: pattern-context-pack
owner: Cascade maintainers
summary: "Dedicated frontend architecture selection for the web base, stack, application technology, frontend infrastructure profile, shared resources, state/data, cache, realtime, UI platform, UI package lifecycle, tenancy, and interfaces."
description: "Use after inspecting a frontend target when selecting its web base, frontend technology, static/SSR/BFF/fullstack infrastructure, shared hosting resources, independently released UI packages, or independently adoptable policy extensions."
routing:
  use_when:
    - "A browser application or separately released UI package needs frontend architecture, stack, application technology, hosting infrastructure, state/data policy, cache, realtime, shared UI platform, or package lifecycle."
    - "Onboarding or architecture review should load frontend defaults without backend, native, CLI, or experiment archetypes."
  do_not_use_when:
    - "The task is backend-only, native-only, CLI-only, experiment-only, or an atomic frontend edit inside an established boundary."
    - "The target already has a coherent enforced frontend architecture and no boundary or policy change is proposed."
  load_when:
    - route: architecture-review
      use_when: "A frontend boundary, stack, state, data, cache, realtime, or UI-platform decision needs a reference default."
    - route: adapt-harness
      use_when: "Target onboarding detects a browser client and needs a bounded frontend comparison."
    - route: plan-change
      use_when: "A new frontend or material frontend policy needs an implementation-draft structure."
    - route: implement-change
      use_when: "An adopted React/Vite or Next.js profile needs a previewed, no-conflict starter structure."
    - route: design-system
      use_when: "Reusable tokens, accessible primitives, components, themes, documentation, or UI packaging are in scope."
  write_when:
    - "The frontend base, frontend stack profile, or one of its extension contracts changes."
    - "Frontend retrieval metadata, selection order, or validation obligations change."
  defer_when:
    - "The rule is feature-specific and belongs in the target feature spec, design owner, or work lane."
    - "A native platform concern should use the native archetype rather than the web frontend family."
  primary_skills:
    - architecture-review
    - adapt-harness
    - plan-change
    - design-system
    - pattern-context
    - validate-change
  related_roles:
    - agent-engineer
    - project-onboarder
    - orchestrator
    - designer
selection_rules:
  - "Load web-frontend as the base; do not load every frontend extension by default."
  - "Resolve architecture-selection first when topology is open, then tenancy and interfaces, the frontend stack profile, applicable policy extensions, frontend-stack, and independent infrastructure extensions."
  - "Keep frontend framework and library candidates separate from compute, data, messaging, edge, delivery, secrets, and observability candidates."
  - "Route the web application through frontend-infrastructure before selecting each justified shared compute, data, messaging, or delivery resource."
  - "Extract web-application claims and policies from project descriptions before selecting React/Vite, Next.js, state, UI, or realtime technology."
  - "Load frontend-state-data before frontend-cache or frontend-realtime because both require its ownership policy."
  - "For a separately released UI component library, compose sdk-library package/public API lifecycle with frontend-ui-platform UI and accessibility governance."
  - "Load each selected graph and paired spec together and record ADOPTED, ADAPTED, REJECTED, or GAP with target evidence."
