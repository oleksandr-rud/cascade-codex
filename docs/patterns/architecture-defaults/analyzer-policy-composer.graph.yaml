schema_id: architecture-default-graph-v1
graph_id: analyzer-policy-composer
pair_kind: extension
title: Stateful Agent Analyzer Policy Composer
status: reference-default
spec_path: docs/patterns/architecture-defaults/analyzer-policy-composer.spec.md
extends:
  - architecture-selection
compatible_with:
  - service-api-worker
  - interface-strategy
  - tenancy-strategy
  - frontend-realtime
preserves:
  - architecture-selection:simplest-sufficient-topology
  - architecture-selection:ownership-before-technology
default_when:
  - A stateful conversational agent needs separate analysis, policy/state authority, and response
    composition.
  - An agent needs voice composition or optional web/KB research under the same state and policy
    authority.
do_not_use_when:
  - A deterministic task or stateless single-call transform has no relevant state or policy boundary.
  - An existing coherent architecture is unchanged and no adaptation was requested.
nodes:
  - id: analyzer-context
    kind: application-policy
    owns: Build the authorized current Analyzer task/observation/catalog view.
  - id: analyzer
    kind: model-boundary
    owns: Interpret observations into typed claims, action requests and uncertainty.
  - id: admission
    kind: application-policy
    owns: Validate the complete declared output, references, scope and current invocation before policy.
  - id: policy-runtime
    kind: application-policy
    owns: Authorize and orchestrate eligible role calls, record admitted analysis, enforce budgets and
      stopping.
  - id: state-memory
    kind: data-boundary
    owns: Host-owned state, observations, analysis records, receipts, CAS and idempotency.
  - id: researcher-context
    kind: application-policy
    owns: Build only the permitted query and source locator view.
  - id: researcher
    kind: optional-model-boundary
    owns: Return scoped source evidence as observations for new analysis.
  - id: composer-context
    kind: application-policy
    owns: Build the current task, admitted claims, uncertainty and referenced evidence view.
  - id: main-composer
    kind: model-boundary
    owns: Author the canonical response from the admitted view without tools or persistence.
  - id: response-gate
    kind: application-policy
    owns: Validate current response identity and required independent semantic/policy gates before atomic
      publication.
edges:
  - from: state-memory
    to: analyzer-context
    relation: supplies_current_scoped_observations
  - from: analyzer-context
    to: analyzer
    relation: supplies_role_context
  - from: analyzer
    to: admission
    relation: returns_claims_and_action_requests
  - from: admission
    to: policy-runtime
    relation: supplies_eligible_typed_analysis
  - from: policy-runtime
    to: state-memory
    relation: records_analysis_under_host_cas
  - from: policy-runtime
    to: researcher-context
    relation: authorizes_scoped_research
  - from: researcher-context
    to: researcher
    relation: supplies_role_context
  - from: researcher
    to: state-memory
    relation: records_source_observations_for_reanalysis
  - from: policy-runtime
    to: composer-context
    relation: authorizes_current_response_task
  - from: composer-context
    to: main-composer
    relation: supplies_role_context
  - from: main-composer
    to: response-gate
    relation: returns_response_candidate
decisions:
  - id: behavior-owner
    default: Consume the versioned Cascade AI Architect analyzer-policy-composer contract and template.
    exception_when: The selected plugin contract is unavailable; record GAP instead of inventing a local replacement.
  - id: logical-boundaries
    default: One modular monolith with vertical use-case slices, current state and direct context functions;
      no required CQRS/event journal/read-model store.
    exception_when: Measured isolation, scaling, or recovery requirements justify separate processes or services.
  - id: optional-variants
    default: Enable Voice Composer only for voice; create research work only for an accepted Analyzer delta
      request.
    exception_when: The target has no voice or research requirement; omit that component entirely.
validation:
  - Bind the owning plugin version/digest and preserve proposal-only Analyzer and deterministic state
    authority.
  - Preserve broad Composer choice for ordinary replies; require a source-bound rule for each fixed
    answer mode or structure.
  - Compile and review the target blueprint against the plugin acceptance table.
  - Prove no-request/no-research, state/context isolation, stale-result handling, and voice interruption
    when enabled.
