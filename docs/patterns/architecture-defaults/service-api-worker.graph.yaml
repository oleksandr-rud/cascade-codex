schema_id: architecture-default-graph-v1
graph_id: service-api-worker
pair_kind: archetype
title: Modular Monolith Backend API And Worker Default
status: reference-default
spec_path: docs/patterns/architecture-defaults/service-api-worker.spec.md
default_when:
  - "A backend API, worker, or server-side application has concrete domain capabilities that need explicit ownership boundaries."
  - "A modular monolith can satisfy current release, scale, data, security, and failure constraints."
do_not_use_when:
  - "The target is an atomic script with no durable domain, data, or interface contract."
  - "Existing package or service ownership already provides coherent domain boundaries."
nodes:
  - id: app-startup
    kind: composition-root
    owns: "Runtime initialization, concrete module assembly, public entrypoint registration, health, and shutdown for one application."
  - id: domain-module
    kind: domain-boundary
    owns: "One named domain entity, aggregate, or cohesive business capability with its state, invariants, use cases, and contracts."
  - id: module-entrypoint
    kind: module-public-surface
    owns: "The owning domain module's intentionally exported calls, registrations, or event contracts."
  - id: module-interface
    kind: inbound-boundary
    owns: "Only the HTTP, RPC, command, job, webhook, or event adapters actually exposed by the module."
  - id: module-state
    kind: state-owner
    owns: "The module's entity models, lifecycle, repository semantics, persistence mapping, and source of truth."
  - id: module-use-cases
    kind: behavior-owner
    owns: "Named domain operations, authorization decisions, transactions, and invariant enforcement."
  - id: module-adapters
    kind: outbound-boundary
    owns: "Domain-specific persistence and provider implementations for module-owned ports."
  - id: shared-technical-capability
    kind: optional-technical-boundary
    owns: "One named stable infrastructure mechanism with at least two current module consumers and no product semantics."
  - id: external-resources
    kind: external-boundary
    owns: "Selected databases, caches, brokers, and third-party services."
edges:
  - from: app-startup
    to: module-entrypoint
    relation: constructs_and_registers
  - from: module-entrypoint
    to: domain-module
    relation: exposes
  - from: module-interface
    to: module-use-cases
    relation: invokes
  - from: module-use-cases
    to: module-state
    relation: changes_under_invariants
  - from: module-use-cases
    to: module-adapters
    relation: depends_on_owned_ports
  - from: module-adapters
    to: external-resources
    relation: connects
  - from: module-adapters
    to: shared-technical-capability
    relation: optionally_reuses
decisions:
  - id: app-owned-vertical-slices
    default: "Name each module after a real domain entity, aggregate, or cohesive capability such as auth, users, customers, CRM, billing, or work-orders."
    exception_when: "The target already has an enforced domain package boundary with equivalent ownership."
  - id: startup-composition
    default: "Keep process initialization, dependency assembly, module registration, health, and shutdown in the application startup boundary."
    exception_when: "A runtime requires a thin launcher elsewhere; it still delegates immediately to startup."
  - id: module-public-surface
    default: "Expose each concrete domain module through one intentional entrypoint; startup and other modules must not import its internals."
    exception_when: "A framework requires an additional explicit generated registration surface."
  - id: shared-libs-scope
    default: "Create no shared technical module by default; extract one named mechanism only after at least two current domain modules need it."
    exception_when: "A framework-mandated runtime capability already has an independently validated owner."
  - id: repository-and-model-reuse
    default: "Keep entity models, access patterns, repository contracts, and implementations in the owning domain module; reject universal CRUD bases."
    exception_when: "A framework requires declarative inheritance that remains free of entity names, product queries, and lifecycle policy."
  - id: event-flow
    default: "Use in-process calls between modules by default. Add durable event delivery only for demonstrated loss, replay, or independent-consumer requirements; the producing module owns event meaning."
    exception_when: "An existing external contract already requires the event interface."
  - id: cross-app-reuse
    default: "Reuse domain behavior only through an explicit owned package or public contract; never hide it in a technical shared folder."
    exception_when: "The behavior is intentionally duplicated because the products have different invariants and owners."
  - id: module-before-service
    default: "Build and release domain modules as one modular monolith until independent release, scale, data, security, availability, or failure isolation is demonstrated."
    exception_when: "A current hard boundary already requires a separately operated service."
  - id: in-process-collaboration
    default: "Use public in-process module contracts and acyclic dependencies; a named domain use case owns cross-module orchestration."
    exception_when: "Durable asynchronous delivery or an existing external boundary requires a transport."
  - id: module-data-ownership
    default: "Allow a shared database while each module owns its tables, models, migrations, and writes; cross-module calls use the owner's public contract."
    exception_when: "A separate read-model owner consumes an explicitly governed projection without inheriting write authority."
validation:
  - "Every top-level module maps to an accepted domain entity or capability and owns identifiable state or policy."
  - "Startup imports public module entrypoints; modules do not import another module's internal files or storage model."
  - "Shared technical capabilities have at least two real consumers and contain no entity-specific behavior."
  - "Contract and persistence tests prove module public behavior, state ownership, and invariants."
  - "Module dependencies are acyclic and ordinary cross-module contracts execute in-process."
  - "Every separately deployed service has a concrete isolation reason, owner, failure contract, and rollback path."
