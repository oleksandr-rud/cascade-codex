    sections:
      - id: architecture-pair-contract
        title: Pair Contract
        anchor: "## Pair Contract"
        summary: "Every default is a stable-ID graph plus a same-stem human-readable spec with bidirectional links."
        routing_description: "Load before creating, changing, or validating an architecture pair."
        tags:
          - architecture
          - graph
          - spec
      - id: architecture-selection
        title: Selection And Adoption
        anchor: "## Selection And Adoption"
        summary: "Reference defaults are selected after target inspection and recorded as adopted, adapted, rejected, or gap."
        routing_description: "Load before applying a default to onboarding, planning, or implementation drafts."
        tags:
          - selection
          - onboarding
          - planning
      - id: architecture-catalog
        title: Pair Catalog
