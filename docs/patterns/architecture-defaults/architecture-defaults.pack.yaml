pack_id: architecture-defaults
entry_id: architecture-defaults
title: Architecture Default Graph And Spec Pairs
kind: pattern-context-pack
owner: Cascade maintainers
summary: "Selectable stack, contour technology, application infrastructure, resource infrastructure, cross-cutting, backend, native, CLI, experiment, and SDK/library defaults; frontend defaults have a dedicated pack."
description: "Use after target inspection when selecting architecture, stack, application technology, application-contour infrastructure, resource infrastructure, or backend, native, CLI, experiment, SDK/library, caching, tenancy, interface, and event concerns."
routing:
  use_when:
    - "A target needs a starting architecture decision, file structure, or implementation-draft boundary model."
    - "Onboarding or architecture review needs a reusable chooser, contour technology, infrastructure, caching, backend, native, CLI, experiment, SDK/library, tenancy, interface, or event reference."
  do_not_use_when:
    - "The task is frontend-specific; use frontend-architecture-defaults instead."
    - "The task only needs current target facts, an atomic file edit, or a framework installation command."
    - "The target already has a coherent established architecture and no boundary change is proposed."
  load_when:
    - route: architecture-review
      use_when: "A cross-boundary plan needs a matching reference topology and exception criteria."
    - route: adapt-harness
      use_when: "Target onboarding needs to compare detected architecture with bounded defaults."
    - route: plan-change
      use_when: "A new service, native client, CLI, experiment, SDK/library, or cache boundary needs an implementation-draft structure."
    - route: implement-change
      use_when: "An adopted backend or frontend technology profile needs a previewed, no-conflict starter structure."
  write_when:
    - "A repeated architecture decision needs a new or revised graph/spec pair."
    - "A pair contract, selection rule, profile, or validation obligation changes."
  defer_when:
    - "The proposed rule is target-specific and belongs in harness.config.yaml, target boundary docs, or a work lane."
    - "No repeated decision or supported profile has been demonstrated."
  primary_skills:
    - architecture-review
    - adapt-harness
    - plan-change
    - pattern-context
    - validate-change
  related_roles:
    - agent-engineer
    - project-onboarder
    - orchestrator
    - designer
selection_rules:
  - "Select one or more pair IDs from target evidence; never load the full catalog by default."
  - "Use frontend-architecture-defaults for web frontend base and policy selection."
  - "Keep application technology and infrastructure resource/provider candidates in separate extension branches."
  - "Route each application unit to its matching contour infrastructure profile, then route each operated resource independently to its resource extension."
  - "Load the graph and paired spec together before adopting or adapting a default."
  - "Apply architecture, archetype, and stack decisions first; resolve applicable extensions and their relationships before selecting the concrete technology that implements those policies."
  - "Extract source-linked claims and policies per deployed, versioned, or distributed application or package unit; do not select one repository-wide stack from a project label."
  - "Record ADOPTED, ADAPTED, REJECTED, or GAP with evidence in the target work lane or owner doc."
