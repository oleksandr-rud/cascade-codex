# Cascade adapter variables.
# Copy to harness.config.yaml after installing the harness in a target project.

project:
  name: "Cascade"
  kind: "standalone coding-agent workflow harness"
  primary_users:
    - "Project maintainers"
    - "Coding agents working in this repository"
  stack:
    backend:
      language: "TypeScript for harness tooling only"
      framework: "none yet"
      package_manager: "Bun 1.3.3"
      runtime:
        - "Bun 1.3.3"
    frontend:
      language: "none yet"
      framework: "none yet"
      build_tool: "none yet"
      package_manager: "none yet"
    data:
      database: "none yet"
      cache: "none yet"
      storage: "none yet"
    integrations:
      - "Codex runtime"
      - "GitHub repository"
    test:
      unit: "Bun test for campaign tooling"
      functional: "Cascade validator, judged harness evals, and simulation campaign self-test"
      e2e: "Playwright browser-task simulations"

models:
  default: "gpt-5.6-sol"
  planning: "gpt-5.6-sol"
  judged_evaluation: "gpt-5.6-terra"
  subagent_execution: "gpt-5.6-terra"
  read_heavy: "gpt-5.6-terra"

paths:
  source_roots:
    - ".agents"
    - ".github"
    - ".codex"
    - "docs"
    - "harness-evals"
    - "product-evals"
    - "scripts"
  test_roots:
    - "harness-evals"
    - "product-evals/campaigns"
    - "product-evals/simulations"
    - "product-evals/intakes"
    - "scripts"
  app_entrypoints:
    - "AGENTS.md"
    - "CODEX.md"
  public_contracts:
    - ".agents/plugins/marketplace.json"
    - ".github/pull_request_template.md"
    - ".github/copilot-instructions.md"
    - "harness.config.yaml"
    - ".codex/config.toml"
    - ".codex/hooks.json"
    - ".codex/plugins/cascade-prompt/.codex-plugin/plugin.json"
    - ".codex/task-admission/task-envelope.schema.json"
    - ".codex/task-admission/policy.schema.json"
    - "package.json"
    - "scripts/cascade.ts"
    - "scripts/cascade/admission.ts"
    - "scripts/cascade/validate.ts"
    - "scripts/cascade/target.ts"
    - "scripts/cascade/evals.ts"
    - "scripts/cascade/briefs.ts"
    - "scripts/cascade/campaign-artifacts.ts"
    - "scripts/cascade/campaign-policies.ts"
    - "scripts/cascade/campaigns.ts"
    - "scripts/cascade/simulations.ts"
    - "scripts/cascade/simulation-intake.ts"
    - "docs/product/catalog.schema.json"
    - "docs/specs/brief-manifest.schema.json"
    - "harness-evals/scenarios.generated.json"
    - "harness-evals/response.schema.json"
    - "harness-evals/judge-response.schema.json"
    - "product-evals/campaigns/catalog.generated.json"
    - "product-evals/campaigns/schema.json"
    - "product-evals/campaigns/run-artifact.schema.json"
    - "product-evals/intakes/schema.json"
    - "product-evals/simulations/schema.json"
    - "product-evals/simulations/persona-derivation.schema.json"
    - "product-evals/simulations/refinement-proposal.schema.json"
    - "product-evals/simulations/refinement-disposition.schema.json"
    - "product-evals/simulations/external-persona-evidence.schema.json"
    - "product-evals/artifact-policy.schema.json"
    - "product-evals/artifact-policy.json"
    - "product-evals/calibrations/schema.json"
    - "product-evals/policies/schema.json"
    - "product-evals/policies/confirmation-receipt.schema.json"
    - "product-evals/rubrics/evaluation-profile.schema.json"
    - "product-evals/rubrics/simulation-evaluation-output.schema.json"
    - "product-evals/rubrics/evaluation-receipt.schema.json"
    - "product-evals/rubrics/deterministic-fixture-v1.json"
    - "product-evals/rubrics/codex-independent-v1.json"
    - ".codex/skills/simulation-campaigns/templates/starter/package.template.json"
    - "harness-evals/judge-profiles.json"
    - "harness-evals/rubrics/outcome-v1.json"
    - "harness-evals/rubrics/trajectory-v1.json"
  docs_root: "docs"
  structure: "docs/structure.md"
  glossary: "docs/glossary.md"
  backlog: "docs/backlog/_index.md"
  product_index: "docs/product/_index.md"
