# Cascade adapter variables.
# Copy to harness.config.yaml after installing the harness in a target project.

project:
  name: "Cascade"
  kind: "standalone coding-agent workflow harness"
  primary_users:
    - "Project maintainers"
    - "Coding agents working in this repository"
  stack:
    backend:
      language: "TypeScript for harness tooling only"
      framework: "none yet"
      package_manager: "Bun 1.3.3"
      runtime:
        - "Bun 1.3.3"
    frontend:
      language: "none yet"
      framework: "none yet"
      build_tool: "none yet"
      package_manager: "none yet"
    data:
      database: "none yet"
      cache: "none yet"
      storage: "none yet"
    integrations:
      - "Codex runtime"
      - "GitHub repository"
    test:
      unit: "Bun test for campaign tooling"
      functional: "Cascade validator, judged harness evals, and simulation campaign self-test"
      e2e: "Playwright browser-task simulations"

models:
  default: "gpt-5.6-sol"
  planning: "gpt-5.6-sol"
  judged_evaluation: "gpt-5.6-sol"
  subagent_execution: "gpt-5.6-sol"
  read_heavy: "gpt-5.6-sol"

plugin_architecture:
  mode: "plugin-first"
  route_registry: ".codex/config.toml#[cascade.plugin_skills]"
  plugin_owns: "reusable workflows, schemas, templates, package validators, dynamic actor semantics, generic judges, and subject evaluation packs"
  host_owns: "current repository context, permissions, mutation, durable paths, target commands, multi-contour campaign state, and repository validation"
  capability_catalog: ".codex/plugin-capabilities.generated.json"
  workflow_planner: "cascade-software-architect:plan-workflow"
  workflow_validator: "scripts/cascade/plugin-workflow.ts"
  missing_dependency: "BLOCKED without copied or cache-searched fallback"
  state_distinction: "repository source, installed cache, execution artifacts, and released package are separate"

