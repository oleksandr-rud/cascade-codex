# Cascade adapter variables.
# Copy to harness.config.yaml after installing the harness in a target project.

project:
  name: "<PROJECT_NAME>"
  kind: "<PROJECT_KIND>"
  primary_users:
    - "<PRIMARY_USER>"
  stack:
    backend:
      language: "<BACKEND_LANGUAGE_OR_NONE>"
      framework: "<BACKEND_FRAMEWORK_OR_NONE>"
      package_manager: "<BACKEND_PACKAGE_MANAGER_OR_NONE>"
      runtime:
        - "<BACKEND_RUNTIME_OR_NONE>"
    frontend:
      language: "<FRONTEND_LANGUAGE_OR_NONE>"
      framework: "<FRONTEND_FRAMEWORK_OR_NONE>"
      build_tool: "<FRONTEND_BUILD_TOOL_OR_NONE>"
      package_manager: "<FRONTEND_PACKAGE_MANAGER_OR_NONE>"
    data:
      database: "<DATABASE_OR_NONE>"
      cache: "<CACHE_OR_NONE>"
      storage: "<STORAGE_OR_NONE>"
    integrations:
      - "<INTEGRATION_OR_NONE>"
    test:
      unit: "<UNIT_TEST_RUNNER_OR_NONE>"
      functional: "<FUNCTIONAL_TEST_RUNNER_OR_NONE>"
      e2e: "<E2E_TEST_RUNNER_OR_NONE>"

models:
  default: "gpt-5.6-sol"
  planning: "gpt-5.6-sol"
  judged_evaluation: "gpt-5.6-sol"
  subagent_execution: "gpt-5.6-terra"
  read_heavy: "gpt-5.6-terra"

paths:
  source_roots:
    - "<SRC_ROOT>"
    - ".github"
    - "harness-evals"
    - "product-evals"
  test_roots:
    - "<TEST_ROOT>"
    - "harness-evals"
    - "product-evals/campaigns"
    - "product-evals/simulations"
  app_entrypoints:
    - "<APP_ENTRYPOINT>"
  public_contracts:
    - "<API_OR_SCHEMA_OR_UI_CONTRACT>"
    - ".github/pull_request_template.md"
    - ".github/copilot-instructions.md"
    - ".codex/hooks.json"
    - ".codex/task-admission/task-envelope.schema.json"
    - ".codex/task-admission/policy.schema.json"
    - "scripts/cascade.ts"
    - "scripts/cascade/admission.ts"
    - "scripts/cascade/validate.ts"
    - "scripts/cascade/target.ts"
    - "scripts/cascade/evals.ts"
    - "scripts/cascade/briefs.ts"
    - "scripts/cascade/campaigns.ts"
    - "scripts/cascade/simulations.ts"
    - "docs/product/catalog.schema.json"
    - "docs/specs/brief-manifest.schema.json"
    - "harness-evals/scenarios.generated.json"
    - "harness-evals/response.schema.json"
    - "harness-evals/judge-response.schema.json"
    - "product-evals/campaigns/catalog.generated.json"
    - "product-evals/campaigns/schema.json"
    - "product-evals/simulations/schema.json"
    - "product-evals/calibrations/schema.json"
    - "product-evals/rubrics/evaluation-profile.schema.json"
    - "product-evals/rubrics/simulation-evaluation-output.schema.json"
    - "product-evals/rubrics/evaluation-receipt.schema.json"
    - "product-evals/rubrics/deterministic-fixture-v1.json"
    - "product-evals/rubrics/codex-independent-v1.json"
    - ".codex/skills/simulation-campaigns/templates/starter/package.template.json"
  docs_root: "docs"
  structure: "docs/structure.md"
  glossary: "docs/glossary.md"
  backlog: "docs/backlog/_index.md"
  product_index: "docs/product/_index.md"
  product_catalog: "docs/product/catalog.yaml"
  product_catalog_schema: "docs/product/catalog.schema.json"
  product_scenarios: "docs/product/scenarios.md"
  personas_index: "docs/product/personas/_index.md"
  design_index: "docs/design/_index.md"
  brand_index: "docs/brand/_index.md"
  specs_index: "docs/specs/_index.md"
  product_brief_schema: "docs/specs/brief-manifest.schema.json"
  product_briefs_glob: "docs/specs/*/brief.yaml"
  product_brief_runner: "scripts/cascade/briefs.ts"
  specs_source: "docs/specs/source"
  specs_slice_pattern: "docs/specs/{slice-slug}"
  work_index: "docs/work/_index.md"
  active_work: "docs/work/active.md"
  work_lane_template: "docs/work/lane-template.md"
  work_lane_examples: "docs/work/examples"
  work_lanes: "docs/work/lanes"
  work_reports: "docs/work/reports"
  work_archive: "docs/archive/work-reports"
  patterns: "docs/patterns"
  graph_fragment_schema: "docs/patterns/workflow/fragments/graph-fragment.schema.json"
  graph_fragments: "docs/patterns/workflow/fragments"
  pattern_context_builder: "scripts/cascade/patterns.ts"
  task_admission_schema: ".codex/task-admission/task-envelope.schema.json"
  task_admission_policy: ".codex/task-admission/policies/core.json"
  task_admission_hook: ".codex/hooks.json"
  task_admission_runner: "scripts/cascade/admission.ts"
  task_admission_cases: "harness-evals/task-admission/cases.json"
  project_analysis_runner: "scripts/cascade/target.ts"
  project_inventory_schema: ".codex/skills/adapt-harness/schemas/project-inventory.schema.json"
  onboarding_manifest_schema: ".codex/skills/adapt-harness/schemas/onboarding-manifest.schema.json"
  harness_evals: "harness-evals"
  harness_eval_catalog: "harness-evals/scenarios.generated.json"
  harness_eval_response_schema: "harness-evals/response.schema.json"
  harness_eval_judge_schema: "harness-evals/judge-response.schema.json"
  harness_eval_runner: "scripts/cascade/evals.ts"
  harness_eval_artifacts: ".artifacts/harness-evals"
  simulation_campaigns: "product-evals/campaigns"
  simulation_catalog: "product-evals/campaigns/catalog.generated.json"
  simulation_runner: "scripts/cascade.ts"
  simulation_evaluator_runner: "scripts/cascade/evaluations.ts"
  simulation_evaluation_profiles: "product-evals/rubrics"
  simulation_evaluation_receipt_schema: "product-evals/rubrics/evaluation-receipt.schema.json"
  simulation_artifacts: ".artifacts/product-evals"
  simulation_artifact_policy: "product-evals/artifact-policy.json"
  simulation_starter_template: ".codex/skills/simulation-campaigns/templates/starter/package.template.json"
  simulation_design_template: ".codex/skills/simulation-campaigns/templates/campaign-design.md"
  harness_simulations: "product-evals/simulations/harness"
  product_simulations: "product-evals/simulations/product"
  browser_runner: ".codex/harness-tooling/playwright.config.ts"

validation_commands:
  install:
    - "<INSTALL_COMMAND>"
  targeted:
    - "<TARGETED_TEST_COMMAND>"
    - "bun scripts/cascade.ts admission validate"
    - "bun scripts/cascade.ts admission corpus"
    - "bun scripts/cascade.ts validate --target"
    - "bun scripts/cascade.ts eval catalog --check"
    - "bun scripts/cascade.ts eval self-test"
    - "bun scripts/cascade.ts campaign catalog --check"
    - "bun scripts/cascade.ts campaign self-test"
  unit:
    - "<UNIT_TEST_COMMAND>"
    - "bun test scripts/cascade"
  lint:
    - "<LINT_COMMAND>"
  typecheck:
    - "<TYPECHECK_COMMAND>"
  build:
    - "<BUILD_COMMAND>"
  functional:
    - "<FUNCTIONAL_TEST_COMMAND>"
  e2e:
    - "<E2E_COMMAND>"

routing:
  model_policy: "Use gpt-5.6-sol for planning, synthesis, security reasoning, and judged evaluation; use gpt-5.6-terra for read-heavy scans and target execution probes."
  admission: "Compile every request through the task-admission microkernel; the Task Envelope selects proportional controls without granting authority or dispatching work."
  non_atomic_fallback_path:
    - "context"
    - "ingest-spec, discover, market-validation, synthesis-to-spec, or compose-spec when source material, missing intent, long business-analysis research, evidence synthesis, or product/spec authoring exists"
    - "docs-impact-map when durable docs may affect sibling rules"
    - "pattern-context when reusable pattern packs or entries are needed"
    - "orchestrate-work"
    - "plan-change"
    - "functional-qa"
    - "implement-change"
    - "review-change"
    - "validate-change"
    - "test-autorepair only if automated tests are stale"
    - "closeout"
  issue_intake: "explicit issue-body or tracker-ticket exception path"
  human_review: "explicit open-question or exception path only"
  stale_test_policy: "test-autorepair preserves semantic coverage; product bugs route to implement-change"
  business_analysis: "business-analyst uses market-validation lanes, synthesis-to-spec for evidence synthesis, and compose-spec for PRDs/personas/spec artifacts"
  security_review: "security uses codebase-audit, auth-analysis, and secure-design for security-sensitive review before implementation"
  design_review: "designer uses ux-flow-review, accessibility-review, visual-qa, and design-system for design-sensitive review before implementation"

vocabulary:
  prefer_codebase_terms: true
  term_sources:
    - "docs/glossary.md"
    - "<PROJECT_SPEC_PATH>"
  forbidden_generic_framing:
    - "generic domain layer"
    - "abstract business object"

functional_acceptance:
  primary_gate: true
  browser_or_e2e_runner: "<PLAYWRIGHT_OR_OTHER_RUNNER>"
  api_check_runner: "<API_CHECK_RUNNER>"
  visual_check_runner: "<VISUAL_CHECK_RUNNER_OR_NONE>"
  source_blind_product_checks: true
  scenario_sources:
    - "docs/product/scenarios.md"
    - "docs/work/active.md"
    - "docs/work/lanes"
    - "docs/work/examples"

memory:
  active_work: "docs/work/active.md"
  onboarding_manifest: "docs/work/onboarding-manifest.json"
  research_memory: "docs/patterns/context-memory/index.md"
  pattern_context_packs: "docs/patterns/*/*.pack.yaml"
  lane_packets: "docs/work/lanes"
  lane_examples: "docs/work/examples"
  work_reports: "docs/work/reports"
  work_archive: "docs/archive/work-reports"
  product_facts:
    - "docs/product"
    - "docs/design"
    - "docs/brand"
    - "docs/specs"
  durable_lessons:
    - ".codex/skills"
    - ".codex/agents"
    - "docs/patterns"
  write_reports_when:
    - "requested"
    - "work_spans_turns"
    - "durable_decision"
    - "blocked_handoff"

issue_tracker:
  provider: "<NONE_OR_TRACKER>"
  project_key: "<PROJECT_KEY>"
  default_project_or_team: "<TRACKER_PROJECT_OR_TEAM>"
  file_when_requested_only: true

patterns:
  root: "docs/patterns"
  schema: "docs/patterns/context-pack-schema.yaml"
  builder: "scripts/cascade/patterns.ts"
  workflow: "docs/patterns/workflow/index.md"
  boundaries: "docs/patterns/boundaries/index.md"
  testing: "docs/patterns/testing/index.md"
  context_memory: "docs/patterns/context-memory/index.md"
  product_context: "docs/patterns/product-context/index.md"
  graph_fragment_schema: "docs/patterns/workflow/fragments/graph-fragment.schema.json"
  graph_fragments_glob: "docs/patterns/workflow/fragments/GF-*.fragment.json"
  packs_glob: "docs/patterns/*/*.pack.yaml"
