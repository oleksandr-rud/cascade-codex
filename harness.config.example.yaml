  product_simulations: "product-evals/simulations/product"
  browser_runner: ".codex/harness-tooling/playwright.config.ts"

validation_commands:
  install:
    - "<INSTALL_COMMAND>"
  targeted:
    - "<TARGETED_TEST_COMMAND>"
    - "bun scripts/cascade.ts admission validate"
    - "bun scripts/cascade.ts admission corpus"
    - "bun scripts/cascade.ts validate --target"
    - "bun scripts/cascade.ts eval catalog --check"
    - "bun scripts/cascade.ts eval self-test"
    - "bun scripts/cascade.ts campaign catalog --check"
    - "bun scripts/cascade.ts campaign self-test"
  unit:
    - "<UNIT_TEST_COMMAND>"
    - "bun test scripts/cascade"
  lint:
    - "<LINT_COMMAND>"
  typecheck:
    - "<TYPECHECK_COMMAND>"
  build:
    - "<BUILD_COMMAND>"
  functional:
    - "<FUNCTIONAL_TEST_COMMAND>"
  e2e:
    - "<E2E_COMMAND>"

routing:
  model_policy: "Use gpt-5.6-sol for planning, synthesis, execution, prompt building, prompt evaluation, and judged evaluation; freeze the reasoning effort in each receipt and use max for prompt/evaluation campaigns unless an explicit comparison says otherwise."
  admission: "Compile every request through the task-admission microkernel; the Task Envelope selects proportional controls without granting authority or dispatching work."
  non_atomic_fallback_path:
    - "context"
    - "plan-change"
    - "implement-change"
    - "validate-change"
  conditional_source_intake: "context in Discovery mode for missing evidence; direct namespaced plugins for reusable interpretation; create-spec only for durable source/spec persistence"
  conditional_docs_impact: "map true documentation consumers inside create-spec, plan-change, implement-change, or closeout only when a durable fact changed"
  conditional_pattern_context: "pattern-context only for reusable pattern entries or compiled context packs"
  conditional_plugin_workflow: "cascade-software-architect:plan-workflow only when multiple plugin capabilities require semantic selection, ordering, parallelization, or a join; its candidate never authorizes dispatch"
  conditional_iteration_planning: "cascade-project-management:plan-project only for requested or genuinely multi-horizon work"
  conditional_orchestration: "cascade-project-management:manage-project only for independently owned, resumable work, dependencies, evidence joins, or reconciliation"
  conditional_quality_planning: "cascade-qa:plan-quality only when accepted behavior has a material quality, acceptance, test, or risk gate"
  conditional_test_design: "cascade-qa:design-tests only when cases or executable evidence contracts are needed"
  conditional_quality_execution: "run-qa-plan only for an authorized frozen Cascade QA artifact"
  conditional_quality_assessment: "cascade-qa:assess-quality only when frozen evidence must be reduced against a quality gate"
  conditional_review: "cascade-software-architect:review-change for public, cross-boundary, security-sensitive, harness-semantic, large, or explicitly requested review"
  conditional_test_repair: "repair-tests only after cascade-qa:triage-defects proves TEST_DRIFT from current public-boundary evidence"
  conditional_closeout: "closeout only for an existing durable work record or reusable handoff"
  conditional_project_closeout: "cascade-project-management:close-project proposes retention; closeout applies exact authorized host changes"
  issue_intake: "cascade-project-management:define-work-item for an explicit issue body or tracker-ready work item"
  human_review: "explicit open-question or exception path only"
  stale_test_policy: "repair-tests preserves semantic coverage after QA proves TEST_DRIFT; product bugs route to implement-change"
  business_analysis: "orchestrator binds repository evidence to Cascade Market and hands frozen findings to Cascade Product"
  security_review: "security selects cascade-security:codebase-audit, cascade-security:auth-analysis, or cascade-security:secure-design directly before target-host implementation"
  design_review: "the requesting role or orchestrator uses namespaced Cascade Design UX, accessibility, visual, and design-system skills directly before any authorized implementation"

vocabulary:
  prefer_codebase_terms: true
  term_sources:
    - "docs/glossary.md"
    - "<PROJECT_SPEC_PATH>"
  forbidden_generic_framing:
    - "generic domain layer"
    - "abstract business object"

functional_acceptance:
  primary_gate: false
  applicability: "conditional on accepted behavior with a named product-visible quality gate"
  planning_owner: "cascade-qa:plan-quality and cascade-qa:design-tests"
  execution_adapter: "run-qa-plan"
  assessment_owner: "cascade-qa:assess-quality"
  browser_or_e2e_runner: "<PLAYWRIGHT_OR_OTHER_RUNNER>"
  api_check_runner: "<API_CHECK_RUNNER>"
  visual_check_runner: "<VISUAL_CHECK_RUNNER_OR_NONE>"
  source_blind_product_checks: true
  scenario_sources:
    - "docs/product/scenarios.md"
    - "docs/work/active.md"
    - "docs/work/lanes"
    - "docs/work/examples"

memory:
  active_work: "docs/work/active.md"
  onboarding_manifest: "docs/work/onboarding-manifest.yaml"
  research_memory: "docs/patterns/context-memory/index.md"
  pattern_context_packs: "docs/patterns/*/*.pack.yaml"
  lane_packets: "docs/work/lanes"
  lane_examples: "docs/work/examples"
  work_reports: "docs/work/reports"
  work_archive: "docs/archive/work-reports"
  product_facts:
    - "docs/product"
    - "docs/design"
    - "docs/brand"
    - "docs/specs"
  durable_lessons:
    - ".codex/skills"
    - ".codex/agents"
    - "docs/patterns"
  write_reports_when:
    - "requested"
    - "work_spans_turns"
    - "durable_decision"
    - "blocked_handoff"

issue_tracker:
  provider: "<NONE_OR_TRACKER>"
  project_key: "<PROJECT_KEY>"
  default_project_or_team: "<TRACKER_PROJECT_OR_TEAM>"
  file_when_requested_only: true

patterns:
  root: "docs/patterns"
  schema: "docs/patterns/context-pack-schema.yaml"
  builder: "scripts/cascade/patterns.ts"
  workflow: "docs/patterns/workflow/index.md"
  boundaries: "docs/patterns/boundaries/index.md"
  testing: "docs/patterns/testing/index.md"
  context_memory: "docs/patterns/context-memory/index.md"
  product_context: "docs/patterns/product-context/index.md"
  graph_fragment_schema: "docs/patterns/workflow/fragments/graph-fragment.schema.json"
  graph_fragments_glob: "docs/patterns/workflow/fragments/GF-*.fragment.yaml"
  packs_glob: "docs/patterns/*/*.pack.yaml"
