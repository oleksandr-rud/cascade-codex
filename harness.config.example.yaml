# Lean target-repository adapter template.
# The Cascade source checkout retains plugin source, eval labs, simulations,
# fixtures, and source tests; a normal target runtime does not copy them.

project:
  harness_profile: "target-project"
  name: "<PROJECT_NAME>"
  kind: "<PROJECT_KIND>"
  primary_users:
    - "<PRIMARY_USER>"
  stack:
    backend:
      language: "<BACKEND_LANGUAGE_OR_NONE>"
      framework: "<BACKEND_FRAMEWORK_OR_NONE>"
      package_manager: "<BACKEND_PACKAGE_MANAGER_OR_NONE>"
      runtime:
        - "<BACKEND_RUNTIME_OR_NONE>"
    frontend:
      language: "<FRONTEND_LANGUAGE_OR_NONE>"
      framework: "<FRONTEND_FRAMEWORK_OR_NONE>"
      build_tool: "<FRONTEND_BUILD_TOOL_OR_NONE>"
      package_manager: "<FRONTEND_PACKAGE_MANAGER_OR_NONE>"
    data:
      database: "<DATABASE_OR_NONE>"
      cache: "<CACHE_OR_NONE>"
      storage: "<STORAGE_OR_NONE>"
    integrations:
      - "<INTEGRATION_OR_NONE>"
    test:
      unit: "<UNIT_TEST_RUNNER_OR_NONE>"
      functional: "<FUNCTIONAL_TEST_RUNNER_OR_NONE>"
      e2e: "<E2E_TEST_RUNNER_OR_NONE>"

models:
  default: "gpt-6-astra"
  planning: "gpt-6-astra"
  judged_evaluation: "gpt-6-astra"
  subagent_execution: "gpt-6-astra"
  read_heavy: "gpt-6-astra"

plugin_architecture:
  mode: "plugin-first"
  route_registry: ".codex/plugin-capabilities.generated.json"
  plugin_lock: ".codex/plugins.lock.json"
  capability_selector: "cascade-coordinator:select-capabilities"
  workflow_planner: "cascade-coordinator:plan-workflow"
  workspace_mcp_server: "cascade_workspace"
  workspace_mcp_runner: ".codex/runtime/workspace-mcp.js"
  workspace_artifact_registry: ".codex/artifact-destinations.json"
  durable_persistence_owner: "closeout"

paths:
  source_roots:
    - "<SRC_ROOT>"
  test_roots:
    - "<TEST_ROOT>"
  app_entrypoints:
    - "<APP_ENTRYPOINT>"
  public_contracts:
    - "<API_OR_SCHEMA_OR_UI_CONTRACT>"
    - ".github/pull_request_template.md"
    - ".github/copilot-instructions.md"
    - ".codex/hooks.json"
    - ".codex/artifact-destinations.json"
    - ".codex/plugin-capabilities.generated.json"
    - ".codex/runtime/cascade.js"
    - ".codex/runtime/workspace-mcp.js"
  docs_root: "docs"
  structure: "docs/structure.md"
  glossary: "docs/glossary.md"
  active_work: "docs/work/active.md"
  patterns: "docs/patterns"
  pattern_context_builder: ".codex/runtime/cascade.js"
  task_admission_schema: ".codex/task-admission/task-envelope.schema.json"
  task_admission_policy: ".codex/task-admission/policies/core.yaml"
  task_admission_hook: ".codex/hooks.json"
  task_admission_runner: ".codex/runtime/cascade.js"
  plugin_capability_catalog: ".codex/plugin-capabilities.generated.json"
  workspace_artifact_registry: ".codex/artifact-destinations.json"
  workspace_mcp_runner: ".codex/runtime/workspace-mcp.js"

validation_commands:
  install:
    - "<INSTALL_COMMAND>"
  targeted:
    - "<TARGETED_TEST_COMMAND>"
    - "npx --offline --yes bun@1.3.3 .codex/runtime/cascade.js target validate --root ."
  unit:
    - "<UNIT_TEST_COMMAND>"
  lint:
    - "<LINT_COMMAND>"
  typecheck:
    - "<TYPECHECK_COMMAND>"
  build:
    - "<BUILD_COMMAND>"
  functional:
    - "<FUNCTIONAL_TEST_COMMAND>"
  e2e:
    - "<E2E_COMMAND>"

routing:
  admission: "Compile each request through the task-admission microkernel; it advises proportional controls but never grants authority or dispatches work."
  non_atomic_fallback_path:
    - "context"
    - "plan-change"
    - "implement-change"
    - "validate-change"
  capability_selection: "Use cascade-coordinator:select-capabilities only for ambiguous or multi-domain plugin work."
  plugin_workflow: "Use cascade-coordinator:plan-workflow only for multiple nodes, dependencies, artifact handoffs, parallel branches, or joins."
  quality: "Cascade QA designs and assesses; the host run-qa-plan adapter executes an authorized frozen plan."
  closeout: "Plugins produce candidates; only the host closeout effect may persist validated durable state."

functional_acceptance:
  primary_gate: false
  applicability: "Enable only for accepted behavior with a named product-visible quality gate."

memory:
  glossary: "docs/glossary.md"
  work: "docs/work"
  product: "docs/product"
  specs: "docs/specs"
  patterns: "docs/patterns"
  backlog: "docs/backlog"

patterns:
  root: "docs/patterns"
  schema: "docs/patterns/context-pack-schema.yaml"
